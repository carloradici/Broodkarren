<!doctype html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f17d04">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brood Opzet">
<meta name="application-name" content="Brood Opzet">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Brood Opzet</title>
<style>
:root{--oranje:#f17d04;--oranjeLicht:#fff1e2;--tekst:#222;--grijs:#8a8a8a;--lijn:#ececec;--kaart:#fff;--achter:#fafafa;--rood:#c62828;--groen:#2e7d32;--op:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--oranjeLicht:#3a2610;--tekst:#f2f2f2;--grijs:#9a9a9a;--lijn:#333;--kaart:#1c1c1e;--achter:#000;--rood:#ef5350;--groen:#66bb6a}}
:root[data-theme="dark"]{--oranjeLicht:#3a2610;--tekst:#f2f2f2;--grijs:#9a9a9a;--lijn:#333;--kaart:#1c1c1e;--achter:#000;--rood:#ef5350;--groen:#66bb6a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--achter);color:var(--tekst);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
main{flex:1;overflow-y:auto;padding-bottom:28px}
.test{background:var(--oranjeLicht);color:var(--oranje);font-size:13px;text-align:center;padding:6px 12px}
.kop{padding:12px 20px 10px}.kop h1{font-size:30px;font-weight:800;margin:0}.kop p{margin:2px 0 0;color:var(--grijs);font-size:15px;line-height:1.35}
.segment{display:flex;margin:0 16px 8px;border-radius:10px;background:var(--oranjeLicht);padding:3px}
.segment button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px;font-weight:600;font-size:15px;color:var(--oranje)}
.segment button.aan{background:var(--oranje);color:var(--op)}
.sectie{margin:14px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;overflow:hidden}
.karkop{background:var(--oranje);color:var(--op);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.karkop b{font-size:17px;font-weight:800}.karkop span{font-size:14px;font-weight:600;white-space:nowrap}
.karkop input{flex:1;background:none;border:0;color:var(--op);font-weight:800;font-size:17px;padding:0;min-width:0}
.karkop input::placeholder{color:rgba(255,255,255,.7)}
.rij{border-top:1px solid var(--lijn)}
.regel{display:flex;align-items:center;padding:12px 14px;width:100%;background:none;border:0;text-align:left;color:inherit}
.plaat{min-width:52px;height:44px;border:2px solid var(--oranje);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-right:14px;padding:0 4px;font-size:17px;font-weight:800;color:var(--oranje);flex:none}
.klaar .plaat{background:var(--grijs);border-color:var(--grijs);color:#fff}
.naam{font-size:17px;font-weight:600}.sub{font-size:14px;color:var(--grijs);margin-top:2px}
.klaar .naam{text-decoration:line-through;color:var(--grijs)}
.let{color:var(--rood);font-weight:600}
.vinkvak{width:30px;height:30px;border-radius:50%;border:2px solid var(--lijn);margin-left:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.klaar .vinkvak{background:var(--oranje);border-color:var(--oranje)}
.groei{flex:1;min-width:0}
.groep{font-size:13px;color:var(--oranje);font-weight:700;margin-left:6px}
.pijl{font-size:26px;color:var(--grijs);margin-left:8px}
.hist{display:block;width:100%;border:0;background:var(--oranjeLicht);color:var(--tekst);text-align:left;padding:8px 14px 8px 80px;font-size:13px;line-height:1.35}
.hist b{color:var(--oranje)}
.histtab{padding:4px 14px 10px 80px;background:var(--oranjeLicht);font-size:13px}
.histtab table{border-collapse:collapse;width:100%}.histtab td,.histtab th{padding:3px 4px;text-align:right}.histtab th{color:var(--grijs);font-weight:600}.histtab td:first-child,.histtab th:first-child{text-align:left}
.toevoegen{display:block;width:100%;border:0;border-top:1px solid var(--lijn);background:none;padding:14px;color:var(--oranje);font-weight:700;font-size:16px}
.knoppen{display:flex;justify-content:center;gap:12px;margin-top:22px;padding:0 16px;flex-wrap:wrap}
.knop{background:var(--oranje);color:var(--op);border:2px solid var(--oranje);border-radius:10px;padding:11px 20px;font-weight:700;font-size:16px}
.knop.rand{background:var(--kaart);color:var(--oranje)}
.leeg{margin:24px;color:var(--grijs);font-size:16px;line-height:1.4}
.link{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px}
.inv{display:flex;align-items:center;gap:10px;padding:10px 14px}
.inv input{width:70px;border:1px solid var(--lijn);border-radius:10px;padding:10px 0;font-size:18px;text-align:center;background:var(--achter);color:var(--tekst)}
.inv input::placeholder{color:var(--grijs)}
.karchip{border:1.5px solid var(--oranje);color:var(--oranje);background:none;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}
.karchip.anders{background:var(--oranje);color:var(--op)}
.advies{border:0;background:var(--oranjeLicht);color:var(--oranje);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}
.stepper button{width:40px;height:40px;border-radius:50%;border:2px solid var(--oranje);background:none;color:var(--oranje);font-size:22px;font-weight:700;line-height:1}
.stepper input{width:54px;border:1px solid var(--lijn);border-radius:10px;padding:9px 0;font-size:18px;text-align:center;background:var(--achter);color:var(--tekst)}
.datumrij{display:flex;align-items:center;gap:8px;margin:0 16px 6px}
.datumrij input{flex:1;border:1px solid var(--lijn);border-radius:10px;padding:10px;font-size:16px;background:var(--kaart);color:var(--tekst)}
.datumrij button{width:44px;height:44px;border-radius:10px;border:2px solid var(--oranje);background:var(--kaart);color:var(--oranje);font-size:20px;font-weight:700}
.samenvat{margin:6px 16px 0;font-size:15px;color:var(--grijs)}
nav{display:flex;background:var(--kaart);border-top:1px solid var(--lijn)}
nav button{flex:1;border:0;background:none;padding:0 0 12px;font-weight:600;font-size:14px;color:var(--grijs)}
nav button:before{content:"";display:block;height:3px;width:60%;margin:0 auto 10px;border-radius:2px}
nav button.aan{color:var(--oranje)}nav button.aan:before{background:var(--oranje)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
.paneel{background:var(--kaart);width:100%;max-width:640px;max-height:92%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.pkop{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--lijn)}
.pkop b{font-size:17px}.pkop button{border:0;background:none;color:var(--oranje);font-size:17px}
.pinhoud{overflow-y:auto;padding:4px 20px 40px}
label{display:block;font-size:14px;font-weight:700;color:var(--grijs);margin:20px 0 8px}
input.veld{width:100%;border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;font-size:17px;background:var(--achter);color:var(--tekst)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--oranje);border-radius:20px;padding:8px 14px;background:none;color:var(--oranje);font-weight:700;font-size:14px}
.chip.aan{background:var(--oranje);color:var(--op)}
.hulp{font-size:13px;color:var(--grijs);margin-top:8px;line-height:1.4}
.minmax{display:flex;gap:16px}.minmax div{flex:1}
.fout{color:var(--rood);font-size:14px;margin-top:8px;min-height:1em}
.schakel{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--lijn);font-size:16px}
.schakel input{width:48px;height:28px;accent-color:var(--oranje)}
.login{padding:24px 20px}.login h1{font-size:30px;font-weight:800;margin:0 0 4px}.login p{color:var(--grijs);margin:0 0 20px;line-height:1.4}
.naamknop{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--lijn);background:var(--kaart);color:var(--tekst);border-radius:12px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:600;text-align:left}
.naamknop.aan{border:2px solid var(--oranje)}
.rol{font-size:13px;color:var(--oranje);font-weight:700}
.pinveld{letter-spacing:10px;text-align:center;font-size:24px!important}
.verwijder{display:block;margin:32px auto 0;border:0;background:none;color:var(--rood);font-weight:600;font-size:16px}
#timers:empty{display:none}
#timers{padding:6px 12px 0;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;align-items:center;gap:10px;background:var(--kaart);border:2px solid var(--oranje);border-radius:12px;padding:8px 12px}
.timer .tijd{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--oranje);min-width:70px}
.timer .info{flex:1;font-size:13px;line-height:1.3;min-width:0}
.timer button{border:0;background:var(--oranje);color:var(--op);border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
.timer.klaar{background:var(--rood);border-color:var(--rood);color:#fff;animation:knipper 1s infinite}
.timer.klaar .tijd{color:#fff}.timer.klaar button{background:#fff;color:var(--rood)}
@keyframes knipper{50%{opacity:.75}}
.datumnav{display:flex;align-items:center;gap:8px;margin:0 16px 8px}
.datumnav button.pijlk{width:44px;height:44px;border-radius:10px;border:2px solid var(--oranje);background:var(--kaart);color:var(--oranje);font-size:20px;font-weight:700;flex:none}
.datumnav .dlabel{flex:1;text-align:center;border:0;background:none;color:var(--tekst);font-size:17px;font-weight:700}
.dlabel small{display:block;font-size:13px;color:var(--oranje);font-weight:600}
.pil{display:inline-block;background:var(--oranje);color:var(--op);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;margin:0 16px 8px}
.notities{margin:6px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px 12px}
.notitie{font-size:15px;padding:6px 0;border-bottom:1px solid var(--lijn);display:flex;gap:8px;align-items:flex-start}
.notitie:last-of-type{border-bottom:0}.notitie .wie{font-size:12px;color:var(--grijs)}
.notitie button{border:0;background:none;color:var(--grijs);font-size:18px;margin-left:auto;padding:0 4px}
.notitieform{display:flex;gap:8px;margin-top:6px}
.notitieform input{flex:1;border:1px solid var(--lijn);border-radius:10px;padding:10px;font-size:16px;background:var(--achter);color:var(--tekst);min-width:0}
.notitieform button{border:0;background:var(--oranje);color:var(--op);border-radius:10px;padding:0 14px;font-weight:700;font-size:15px}
.acties{display:flex;gap:10px;margin:12px 16px 0}
.acties .knop{flex:1;padding:12px 8px;font-size:15px}
.regel.gekozen{background:var(--oranjeLicht)}
.kiesvak{width:30px;height:30px;border-radius:8px;border:2px solid var(--oranje);margin-left:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.gekozen .kiesvak{background:var(--oranje)}
.ovenbalk{position:sticky;bottom:0;margin:16px 0 0;background:var(--kaart);border-top:2px solid var(--oranje);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ovenbalk .rijtje{display:flex;gap:10px;align-items:center}
.ovenbalk input{width:64px;border:1px solid var(--lijn);border-radius:10px;padding:9px 0;font-size:17px;text-align:center;background:var(--achter);color:var(--tekst)}
select.veld{width:100%;border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;font-size:17px;background:var(--kaart);color:var(--tekst);-webkit-appearance:none;appearance:none}
.planbalk{margin:0 16px 8px}
.menu .regel{padding:16px}
.terug{border:0;background:none;color:var(--oranje);font-size:17px;padding:10px 16px 0;font-weight:600}
.tabel{width:100%;border-collapse:collapse;font-size:14px}
.tabel th{text-align:right;color:var(--grijs);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--lijn)}
.tabel td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--lijn)}
.tabel th:first-child,.tabel td:first-child{text-align:left}
.tabelwrap{overflow-x:auto}
.hoog{color:var(--rood);font-weight:700}.goed{color:var(--groen);font-weight:700}
.kaartje{margin:14px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:12px 14px}
.kaartje h3{margin:0 0 6px;font-size:16px}
.cijfers{display:flex;gap:10px;margin:10px 16px 0}
.cijfer{flex:1;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px;text-align:center}
.cijfer b{display:block;font-size:22px;color:var(--oranje)}.cijfer span{font-size:12px;color:var(--grijs)}
.logregel{padding:10px 14px;border-top:1px solid var(--lijn);font-size:14px}
.logregel .wie{color:var(--grijs);font-size:12px}
.daglabel{padding:8px 14px;background:var(--oranjeLicht);font-size:13px;font-weight:700;color:var(--oranje)}
.dagchips{display:flex;gap:6px;flex-wrap:wrap}
.dagchips .chip{padding:8px 12px}
#werk{position:fixed;inset:0;background:var(--achter);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#werk.open{display:flex}
.wkop{display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.wkop button{border:0;background:none;color:var(--oranje);font-size:17px;font-weight:600}
.wkop span{color:var(--grijs);font-weight:600}
.wbalk{height:6px;background:var(--lijn);margin:0 18px;border-radius:3px;overflow:hidden}.wbalk div{height:100%;background:var(--oranje)}
.winhoud{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column}
.wkar{color:var(--grijs);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.5px}
.wplaat{font-size:64px;font-weight:900;color:var(--oranje);line-height:1.05;margin:4px 0 14px}
.wplaat small{font-size:22px;color:var(--grijs);font-weight:700;display:block}
.witem{background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.witem .n{font-size:24px;font-weight:800}.witem .a{font-size:18px;color:var(--grijs);margin-top:4px}
.witem.ok{opacity:.55}.witem.ok .n{text-decoration:line-through}
.wknoppen{padding:12px 18px 16px;display:flex;flex-direction:column;gap:10px}
.wgroot{border:0;background:var(--oranje);color:var(--op);border-radius:14px;padding:20px;font-size:21px;font-weight:800}
.wklein{display:flex;gap:10px}.wklein button{flex:1;border:2px solid var(--oranje);background:var(--kaart);color:var(--oranje);border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.klaarscherm{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.klaarscherm b{font-size:60px;color:var(--oranje)}
.statusrij{margin-top:4px;font-size:12px;color:var(--grijs);display:flex;flex-wrap:wrap;gap:4px}
.st{border-radius:8px;padding:1px 7px;font-weight:700;font-size:12px}
.st.oven{background:var(--rood);color:#fff}.st.gebak{background:var(--oranje);color:#fff}.st.schap{background:var(--groen);color:#fff}
.regel.uit{opacity:.45}
.ovenstep{display:flex;align-items:center;gap:10px;padding:8px 14px 10px 80px;background:var(--oranjeLicht);font-size:14px}
.ovenstep input{width:48px}
.avondkaart{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 32px);margin:10px 16px 0;border:2px solid var(--oranje);background:var(--oranjeLicht);color:var(--tekst);border-radius:12px;padding:12px 14px;font-size:15px;text-align:left}
.avondkaart span{color:var(--oranje);font-weight:700;font-size:14px}
textarea.veld{font-family:inherit;resize:vertical;line-height:1.4}
.fotorij{display:flex;gap:14px;align-items:center}
#fotoVoorbeeld{width:110px;height:110px;border-radius:12px;border:1px solid var(--lijn);background:var(--achter);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--grijs);font-size:13px;flex:none}
#fotoVoorbeeld img{width:100%;height:100%;object-fit:cover}
.duim{width:44px;height:44px;border-radius:8px;object-fit:cover;margin-right:12px;flex:none}
.wfoto{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.wprog{margin-top:8px;font-size:17px;color:var(--tekst)}.wprog b{color:var(--oranje)}
.winstr{margin-top:8px;font-size:16px;line-height:1.45;background:var(--oranjeLicht);border-radius:10px;padding:10px 12px}

#opslagmelding{display:none;background:var(--rood);color:#fff;font-size:14px;padding:8px 14px;text-align:center}
.status{font-size:13px;padding:6px 12px;text-align:center;color:var(--grijs)}
.status.ok{color:var(--groen)}.status.uit{background:var(--rood);color:#fff}
#statusplek .status:empty{display:none}
.kaartje .status{text-align:left;padding:2px 0 6px}
.rijflex{display:flex;align-items:stretch}.rijflex .regel{flex:1;min-width:0}
.pot{width:46px;flex:none;border:0;border-left:1px solid var(--lijn);background:none;color:var(--grijs);font-size:20px}
.st.extra{background:var(--oranje);color:#fff}.st.aangepast{background:var(--oranjeLicht);color:var(--oranje);border:1px solid var(--oranje)}
.grootstep{display:flex;align-items:center;justify-content:center;gap:16px;margin:14px 0}
.grootstep button{width:56px;height:56px;border-radius:50%;border:2px solid var(--oranje);background:none;color:var(--oranje);font-size:28px;font-weight:700}
.grootstep input{width:100px;border:1px solid var(--lijn);border-radius:12px;padding:12px 0;font-size:28px;font-weight:800;text-align:center;background:var(--achter);color:var(--tekst)}
.vrknop{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--oranje);background:var(--kaart);color:var(--tekst);border-radius:12px;padding:8px 10px;min-width:104px}
.vrknop small{font-size:11px;color:var(--grijs)}.vrknop b{font-size:14px;color:var(--oranje)}
.linkgrijs{border:0;background:none;color:var(--grijs);text-decoration:underline;font-size:14px}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,input,select,textarea,label{touch-action:manipulation}
input,select,textarea{font-size:max(16px,1em)}
.koprij{display:flex;align-items:center;justify-content:space-between;gap:10px}
.info{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--oranje);background:var(--kaart);color:var(--oranje);font-weight:800;font-size:16px;line-height:1}
.op-slot{opacity:.45}
nav button.op-slot{color:var(--grijs)}
.slotje{vertical-align:-2px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:86%;text-align:center}
#toast.zichtbaar{opacity:1;transform:translateX(-50%) translateY(0)}
.duim.klein{width:44px;height:44px;margin-right:10px}

const zonderRev=v=>{if(isObj(v)&&'_rev' in v){const{_rev,...r}=v;return r}return v};
const stabiel=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((r,x)=>(r[x]=v[x],r),{}):v);

/* ================= laden en omzetten ================= */
function vanV1(d){
  const S={soorten:[],karren:d.karren||[],plan:{mv:{},za:{},zo:{}},karOverride:{},historie:{},derving:{}};
  for(const it of d.items||[]){
    const mv=it.mv||{},st=[mv.s,it.za?.s,it.zo?.s].filter(x=>x>0),max=st.length?Math.max(...st):12;
    S.soorten.push({id:it.id,naam:it.naam,kar:it.kar,groep:it.groep||'',min:1,max});
    const m=(mv.p||0)*(mv.s||0);S.plan.mv[it.id]=m;
    for(const k of['za','zo']){const x=it[k]||{};if(x.p==null&&x.s==null)continue;const v=(x.p??mv.p??0)*(x.s??mv.s??0);if(v!==m)S.plan[k][it.id]=v}
  }
  return S;
}
function naarV3(S){
  if(S.versie>=3)return S;
  const plan={mv:{m1:{}},za:{m1:{}},zo:{m1:{}}};
  for(const k of['mv','za','zo'])for(const[id,v]of Object.entries((S.plan||{})[k]||{}))if(v!=null)plan[k].m1[id]=v;
  S.plan=plan;S.momenten=[{id:'m1',naam:'Ochtend'}];S.vinkjes={};S.versie=3;return S;
}
function naarV6(S){
  if(S.versie>=6)return S;
  if(S.plan.mv){S.plan.ma=S.plan.mv;delete S.plan.mv}
  for(const k of['ma','di','wo','do','vr','za','zo'])S.plan[k]=S.plan[k]||{};
  S.fotos=S.fotos||{};
  for(const s of S.soorten||[]){if(s.foto){S.fotos[s.id]=s.foto}delete s.foto;delete s.ontdooien}
  if(Array.isArray(S.timers)){const o={};for(const t of S.timers)o[t.id]=t;S.timers=o}
  if(Array.isArray(S.log)){const o={};S.log.forEach((l,i)=>o['l'+l.t.toString(36)+i]=l);S.log=o}
  for(const d of Object.keys(S.notities||{}))if(Array.isArray(S.notities[d])){const o={};for(const n of S.notities[d])o[n.id]=n;S.notities[d]=o}
  const vr={};for(const[id,v]of Object.entries(S.voorraad||{})){if(typeof v==='number'){const s=(S.soorten||[]).find(x=>x.id===id);vr[id]={basis:v*(s?.perDoos||1),t:Date.now()}}else vr[id]=v}S.voorraad=vr;
  for(const d of Object.keys(S.vinkjes||{}))for(const m of Object.keys(S.vinkjes[d]||{}))for(const id of Object.keys(S.vinkjes[d][m]||{}))if(S.vinkjes[d][m][id]===true)S.vinkjes[d][m][id]={n:0,t:0};
  delete S.sessie;delete S.laatsteActie;S.versie=6;return S;
}
function vulAan(S){
  for(const k of['historie','derving','karOverride','afwijkend','notities','voorraad','vinkjes','status','avond','dervBest','aanpas','timers','log','fotos','snij','ontdooi','dervHH','bijbak','profielen','berichten','karTaak','afsluit','feestNee','notfotos','dervReg','levering'])S[k]=isObj(S[k])?S[k]:{};
  for(const k of['gebruikers','soorten','karren'])S[k]=Array.isArray(S[k])?S[k]:[];
  S.plan=isObj(S.plan)?S.plan:{};for(const k of['ma','di','wo','do','vr','za','zo'])S.plan[k]=isObj(S.plan[k])?S.plan[k]:{};
  S.leverdagen=Array.isArray(S.leverdagen)?S.leverdagen:[1,3,5];S.ovenMax=S.ovenMax||10;

    if(!regels.length)continue;
    const gk=s=>s.groep&&s.groep.trim()?'g:'+s.groep.trim().toUpperCase():'e:'+s.id;
    const gp={};for(const r of regels){if(r.s.type==='ontdooien'){r.v={platen:0,delen:[r.n],rest:r.n};r.g='o:'+r.s.id;r.ontdooi=true;continue}r.v=verdeling(r.n,r.s.max);r.g=gk(r.s);gp[r.g]=Math.max(gp[r.g]||0,r.v.platen)}

function historie(s,groep){
  return Object.keys(S.derving).filter(d=>dagGroep(d)===groep&&!S.afwijkend[d]&&!S.historie[d]?.afw&&S.derving[d]?.[s.id]!=null).sort().reverse().slice(0,8)

}
function advies(s,groep){
  const h=historie(s,groep).slice(0,4);if(h.length<2)return null;
  const gemDer=h.reduce((t,x)=>t+x.der,0)/h.length,gemGezet=h.reduce((t,x)=>t+x.gezet,0)/h.length;
  if(h.every(x=>x.der===0))return{h,gemDer,gemGezet,op:true};
  const gw=[4,3,2,1].slice(0,h.length),som=gw.reduce((a,b)=>a+b,0),gew=h.reduce((t,x,i)=>t+x.verkochtAdv*gw[i],0)/som;
  let trend='';if(h.length>=4){const nu=(h[0].verkochtAdv+h[1].verkochtAdv)/2,oud=(h[2].verkochtAdv+h[3].verkochtAdv)/2;if(oud>0&&(nu-oud)/oud>=0.1)trend='↑';else if(oud>0&&(nu-oud)/oud<=-0.1)trend='↓'}
  return{h,gemDer,gemGezet,trend,aantal:Math.max(s.min||0,Math.ceil(gew))};
}
function adviesTekst(a,huidig,groep){
  if(!a)return'';if(a.op)return`<b>${a.h.length}× niets over</b> (${GROEP[groep]}) – misschien meer klaarzetten?`;
  const pct=a.gemGezet?Math.round(a.gemDer/a.gemGezet*100):0;
  return`Gem. ${Math.round(a.gemDer*10)/10} over (${pct}%), laatste ${a.h.length} ${GROEP[groep]}`+(a.trend?` <b>${a.trend==='↑'?'↑ stijgend':'↓ dalend'}</b>`:'')+(a.aantal!==huidig?` – <b>advies ${a.aantal} per dag</b>`:'');
}
function verdeelAdvies(pk,s,A){

function splitsen(){
  const o={'beheer:gebruikers':{lijst:S.gebruikers},instellingen:{soorten:S.soorten,karren:S.karren,momenten:S.momenten,ovenMax:S.ovenMax,leverdagen:S.leverdagen,programmas:S.programmas},

  const dagen=new Set();for(const k of DAGVELDEN)for(const d of Object.keys(S[k]))dagen.add(d);
  for(const d of dagen){const x={};for(const k of DAGVELDEN)if(S[k][d]!==undefined)x[k]=S[k][d];o['dag:'+d]=x}
  for(const[id,l]of Object.entries(S.log)){const k='log:'+iso(new Date(l.t));(o[k]=o[k]||{})[id]=l}
  for(const[id,f]of Object.entries(S.fotos))o['foto:'+id]={data:f||null};

}
function pasToe(k,v){
  if(!isObj(v))return;v=zonderRev(v);
  if(k==='beheer:gebruikers')S.gebruikers=Array.isArray(v.lijst)?v.lijst:[];
  else if(k==='instellingen'){for(const f of['soorten','karren','momenten','ovenMax','leverdagen','programmas'])if(v[f]!==undefined)S[f]=v[f]}
  else if(k==='plan'){S.plan=v.plan||{};S.karOverride=v.karOverride||{};S.feestNee=v.feestNee||{}}
  else if(k==='afwijkend')S.afwijkend=v;
  else if(k==='voorraad')S.voorraad=v;
  else if(k==='profielen')S.profielen=v;
  else if(k==='berichten')S.berichten=v;
  else if(k.startsWith('dag:')){const d=k.slice(4);for(const f of DAGVELDEN){if(v[f]!==undefined)S[f][d]=v[f];else delete S[f][d]}}
  else if(k.startsWith('log:')){const d=k.slice(4);for(const[id,l]of Object.entries(S.log))if(iso(new Date(l.t))===d&&!v[id])delete S.log[id];Object.assign(S.log,v)}
  else if(k.startsWith('foto:')){const id=k.slice(5);if(v.data)S.fotos[id]=v.data;else delete S.fotos[id]}
  else if(k.startsWith('notfoto:')){const id=k.slice(8);if(v.data)S.notfotos[id]=v.data;else S.notfotos[id]=null}
  vulAan(S);
}
function diff(a,b,pad=[],ops=[]){

  if(isObj(a)&&isObj(b)){for(const k of Object.keys(b))diff(a[k],b[k],[...pad,k],ops);for(const k of Object.keys(a))if(!(k in b))ops.push({p:[...pad,k],del:true})}
  else if(stabiel(a)!==stabiel(b))ops.push({p:pad,v:kloon(b)});
  return ops;
}
function pasOpsToe(obj,ops){
  let root=isObj(obj)?obj:{};
  for(const op of ops){if(!op.p.length){if(!op.del)root=kloon(op.v);continue}
    let o=root;for(let i=0;i<op.p.length-1;i++){if(!isObj(o[op.p[i]]))o[op.p[i]]={};o=o[op.p[i]]}
    const l=op.p[op.p.length-1];if(op.del)delete o[l];else o[l]=kloon(op.v)}
  return root;
}
function ontvang(k,v){
  if(!isObj(v))return;const rev=v._rev||0;if(revs[k]!=null&&rev<=revs[k])return;revs[k]=rev;v=zonderRev(v);
  const lokaal=splitsen()[k],lj=stabiel(lokaal);
  if(basis[k]===undefined||lokaal===undefined||lj===basis[k]){basis[k]=stabiel(v);pasToe(k,v)}
  else{const ops=diff(JSON.parse(basis[k]),lokaal);basis[k]=stabiel(v);pasToe(k,pasOpsToe(kloon(v),ops));planSync()}
}

  try{
    for(const k of Object.keys(splitsen())){
      if(k.startsWith('beheer:')&&!L.beheerder)continue;

        const lokaal=splitsen()[k],lokaalJ=stabiel(lokaal);

        zetStatus('bezig');

        else if(bestaat&&isObj(sb)&&isObj(lokaal))nieuw=pasOpsToe(kloon(sb),diff({},lokaal));

        catch(e){if(e&&e.conflict&&poging<5){await new Promise(r=>setTimeout(r,150+Math.random()*300));continue}throw e}
        revs[k]=Math.max(revs[k]||0,rev);basis[k]=stabiel(nieuw);

    if(veranderd)renderZacht();if(syncOpnieuw&&!fout){syncOpnieuw=false;sync()}}
}

function ovenGekozen(sec){
  const uit=[];for(const s of sec){const gezien={};for(const r of s.regels){const gk=gKey(s.nr,r);if(ovenKeuze[gk]==null)continue;
    if(!gezien[gk]){gezien[gk]={gk,n:ovenKeuze[gk],plaat:r.plaat,regels:[]};uit.push(gezien[gk])}gezien[gk].regels.push(r)}}
  return uit;
}
function ovenBalk(sec){
  const gek=ovenGekozen(sec),regels=gek.flatMap(g=>g.regels),totaal=gek.reduce((t,g)=>t+g.n,0);
  const temps=[...new Set(regels.map(r=>r.s.temp).filter(x=>x>0))],progs=[...new Set(regels.map(r=>(r.s.programma||'').trim()).filter(Boolean))];
  const teVeel=totaal>S.ovenMax,w=[];
  if(teVeel)w.push(`maximaal ${S.ovenMax} platen in de oven`);if(progs.length>1)w.push("verschillende programma's");else if(temps.length>1)w.push('verschillende temperaturen');
  return`<div class="ovenbalk"><div>${gek.length?`<b>${totaal} van max. ${S.ovenMax} platen</b>${progs.length?` – prog. ${progs.map(esc).join(' / ')}`:''}${temps.length?` – ${temps.join('/')}°C`:''}`:'Tik aan wat de oven in gaat en kies het aantal platen.'}${w.length?`<div class="let">Let op: ${w.join(', ')}!</div>`:''}</div>

}

 ['bijbakken','Bijbakken','Is er iets op tijdens de dag? Tik op Klaarzetten op Bijbakken en tik alle soorten aan die je wilt bijbakken. Elke soort staat meteen op 1 plaat met het maximum per plaat; pas met − en + de platen en de stuks per plaat aan (bijv. 12 naar 9). Tik op In de oven: alles komt als één lading in het blok Bijgebakken. Tik op Afgebakken als de lading klaar is. Bijbakken telt mee als opgezet en gaat van de voorraad af, maar verhoogt het advies niet. In de historie en het weekrapport zie je hoe vaak er is bijgebakken.'],
 ['vers','Vers brood','Vers brood staat onderaan Klaarzetten. Vul elke dag eerst de levering in met de knop Levering invullen (pakbon): neem de aantallen over van de pakbon en maak eventueel een foto. Daarna rekent de app met het geleverde aantal. Bij ongesneden brood stel je met twee regelaars in hoeveel hele en hoeveel halve broden je maakt, elk met een eigen PLU om te stickeren. Je kunt nooit boven het geleverde aantal uitkomen. Blijft er iets over, bijvoorbeeld een half brood door een gat, tik dan op Derven: het komt bij Derving te staan en je slaat het daar op met Lijst opslaan.'],
 ['invullen','Invullen (planning)','Kies bovenaan de dag (maandag t/m zondag). Vul per soort het aantal stuks in. Een leeg vakje bij dinsdag t/m zondag betekent: zelfde als maandag (grijs getal). 0 betekent: niet klaarzetten. Met "Kopieer naar…" zet je een dag in één keer over naar andere dagen.'],
 ['advies','Advies','Als er een paar dagen derving is ingevuld, rekent de app uit hoeveel er gemiddeld verkocht wordt. Ma t/m vr tellen samen; zaterdag en zondag apart. "Advies gebruiken" of "Alles op advies" past de planning aan; je ziet eerst wat er verandert.'],
 ['derving','Derving','Kies de bestemming (weggegooid, voedselbank of TGTG) en vul met − en + in wat er weg moet. Tik op Lijst opslaan: je krijgt een compacte lijst met naam, PLU en aantal om in de kassa over te nemen, en de tellers staan weer op nul. Zo kun je \'s ochtends en \'s avonds een lijst opslaan. De lijsten vind je via Opgeslagen lijsten op Derving en onder Meer → Dervinglijsten. Vink per regel af wat in de kassa staat en tik op Verwerkt in kassa.'],
 ['ontdooi','Ontdooien zoet','Een lijst die je zelf vult met wat er uit de vriezer moet, bijvoorbeeld voor morgen. Kies een broodsoort of typ vrije tekst. Vink af wat eruit is. Staat er iets op de lijst, dan zie je een kaart op Klaarzetten.'],
 ['afwijkend','Afwijkende dagen','Een eigen planning voor één datum, zoals een feestdag. Kies bij het aanmaken "Kopie van gewone planning" of "Alles op 0 (gesloten)". Via "Aantallen" pas je de planning van die dag aan.'],
 ['bestel','Deegbestelling en voorraad','Tel af en toe de voorraad in de vriezer (dozen + losse stuks). Wat daarna wordt afgevinkt op Klaarzetten gaat er automatisch af. Kies je leverdagen; de app rekent uit hoeveel dozen je moet bestellen tot de levering daarna. Vers brood telt niet mee.'],
 ['rapport','Weekrapport','Per week: wat er opgezet is, wat er over was en het dervingspercentage per soort, plus opvallende soorten en de dagnotities. Met "Delen" stuur je het door.'],
 ['soorten','Broodsoorten en instellingen','Per soort stel je in: soort product (afbakken, ontdooien of vers geleverd), standaard kar, min/max per plaat, ovenprogramma, baktijd, stuks per doos, werkinstructie en foto. Hier beheer je ook karren, bakmomenten en het maximum aantal platen in de oven.'],
 ['team','Medewerkers en rechten','Alleen de beheerder, op zijn eigen gekoppelde telefoon. Voeg medewerkers toe met een pincode en zet per persoon rechten aan of uit. Onderdelen zonder recht staan grijs met een slotje.'],
 ['instellingen','App-instellingen','Onder Meer → App-instellingen richt je de app naar eigen smaak in: licht of donker, tekstgrootte, compacte lijst, foto\'s, achtergrondpatroon, PLU-nummers, je eigen emoji, een accentkleur, de startpagina, je standaard bakmoment en de meldingen. Het geldt alleen voor jou en werkt op elk toestel waar je inlogt.'],
 ['programmas',"Bakprogramma's","Onder Meer → Bakprogramma's beheer je de ovenprogramma's met temperatuur en baktijd. Tik op een programma en tik de producten aan die erbij horen; zo koppel je veel producten in één keer. Een product hoort bij één programma. Pas je de temperatuur of baktijd aan, dan geldt dat meteen voor alle gekoppelde producten. Bij een broodsoort kies je het programma uit de lijst."],
 ['zoeken','Zoeken en productinfo','Op Klaarzetten zoek je met ⌕ bovenin op naam of PLU. Met ⓘ bij een regel zie je foto, werkinstructie, programma, allergenen en ingrediënten.'],
 ['ongedaan','Ongedaan maken','Na afvinken, afgebakken, bijbakken of een aangepast aantal verschijnt onderaan kort een balk met "Ongedaan maken". Tik erop om je laatste actie terug te draaien.'],
 ['kartaak','Taken per kar','De beheerder (of wie het recht Invullen heeft) tikt op de kop van een kar om iemand toe te wijzen voor die dag. Jouw eigen kar staat bovenaan. Bij elk vinkje staan de voorletters en de tijd van wie het deed.'],
 ['afsluiten','Dag afsluiten','Onder Meer → Dag afsluiten zie je wat er aan het eind van de dag nog moet: afvinken, derving en Ontdooien zoet voor morgen. Laat eventueel een notitie voor morgen achter en tik op Dag afsluiten.'],
 ['berichten','Vraag of melding','Medewerkers sturen via Meer → Vraag of melding een bericht naar de beheerder. De beheerder ziet een rood bolletje bij Meer en leest de berichten onder Meer → Berichten.'],
 ['gedaan','Vandaag gedaan','Alleen voor de beheerder: per persoon wat er op een dag is gedaan, met tijden. Blader met ‹ › naar andere dagen.'],
 ['printen','Printen','Onder de lijst op Klaarzetten staat Printen: de klaarzetlijst per kar op A4, met plaatnummers, PLU en vinkvakjes. Via het printmenu kun je ook een PDF delen.'],
 ['feest','Feestdagen','Drie weken voor een feestdag verschijnt op Klaarzetten een voorstel om er een afwijkende dag van te maken: kopie van de planning, gesloten of niet nodig.'],
 ['weer','Weer','Bij Klaarzetten en Invullen zie je het weer in Vogelenzang met een hint bij opvallend weer. Het advies verandert daar niet vanzelf door.'],
 ['nieuw','Nieuwe producten','Zet bij een broodsoort "Nieuw product" aan. Onder Meer → Nieuwe producten zie je per week hoe het verkoopt.'],
 ['export','Exporteren naar Excel','Onder Meer → Exporteren kies je derving, weekrapport of planning en een periode. Het Excel-bestand deel je via het deelmenu: opslaan, mailen of versturen.'],
 ['notities','Notities','Onder Meer → Notities vind je alle dagnotities van de afgelopen 6 maanden, nieuwste eerst. Zoek op een woord of naam, of toon alleen notities met een foto. Met Bekijk dag ga je naar Klaarzetten op die dag. Tik op een foto om hem groot te zien; tik nog eens om in te zoomen.'],
 ['plu','PLU-lijst','Onder Meer → PLU-lijst vind je alle PLU-nummers. Typ een deel van de naam of het nummer om te zoeken. Kies Op naam of Per kar. Het PLU-nummer staat ook achter de naam op Klaarzetten en groot in de werkmodus. Vul PLU-nummers in bij Broodsoorten.'],
 ['koppelen','Koppelen en inloggen','Elk toestel wordt één keer gekoppeld met de winkel-login of de beheerders-login. Daarna logt iedereen in met naam en pincode. Na 60 minuten niets doen wordt er automatisch uitgelogd. Bovenaan zie je of de app online is; offline wijzigingen worden later verzonden.']
];

  const seg=(k,opts)=>`<div class="segment" style="margin:8px 0 0">${opts.map(([v,l])=>`<button data-a="prof" data-k="${k}" data-v="${v}" class="${String(p[k])===String(v)?'aan':''}">${l}</button>`).join('')}</div>`;
  const sw=(k,l)=>`<label class="schakel" style="margin:0;color:var(--tekst);font-weight:400">${l}<input type="checkbox" data-prof="${k}" ${p[k]?'checked':''}></label>`;
  return`<div class="kop"><div class="koprij"><h1>App-instellingen</h1>${info('instellingen')}</div><p>Alleen voor jou. Werkt op elk toestel waar je inlogt.</p></div>
   <div class="kaartje"><h3>Weergave</h3>${seg('thema',[['auto','Automatisch'],['licht','Licht'],['donker','Donker']])}
   <div class="hulp" style="margin-top:14px">Tekstgrootte</div>${seg('tekst',[['normaal','Normaal'],['groot','Groot'],['xl','Extra groot']])}</div>
   <div class="kaartje"><h3>Lijsten</h3>${sw('compact','Compacte lijst')}${sw('fotos',"Foto's tonen")}${sw('patroon','Achtergrondpatroon')}${sw('plu','PLU-nummers tonen')}</div>
   <div class="kaartje"><h3>Persoonlijk</h3><div class="hulp" style="margin:0 0 6px">Jouw emoji</div>
   <div class="emojis">${['',...EMOJI].map(e=>`<button class="emojiknop ${p.emoji===e?'aan':''}" data-a="prof" data-k="emoji" data-v="${e}">${e||'geen'}</button>`).join('')}</div>
   <div class="hulp" style="margin:14px 0 6px">Accentkleur</div><div class="emojis">${ACCENTEN.map(([k,l,c])=>`<button class="kleurknop ${p.accent===k?'aan':''}" data-a="prof" data-k="accent" data-v="${k}"><i style="background:${c}"></i>${l}</button>`).join('')}</div>
   <div class="hulp" style="margin-top:14px">Startpagina na inloggen</div>${seg('start',[['lijst','Klaarzetten'],['derving','Derving'],['plan','Invullen']])}
   ${S.momenten.length>1?`<div class="hulp" style="margin-top:14px">Standaard bakmoment</div>${seg('moment',[['','Geen'],...S.momenten.map(m=>[m.id,esc(m.naam)])])}`:''}</div>
   <div class="kaartje"><h3>Meldingen</h3>${sw('feest','"Alles klaargezet!"-melding')}${sw('groet','Begroeting en voortgangsring')}</div>`}

function openProgramma(id){

  const veld=(i,l,v,ph,num)=>`<div><div class="hulp" style="margin:0 0 4px">${l}</div><input class="veld" id="${i}" ${num?'inputmode="numeric" maxlength="3"':''} value="${esc(v??'')}" placeholder="${ph}"></div>`;
  toonSheet(`<div class="pkop"><button data-a="sluit">Annuleren</button><b>${id?'Bakprogramma':'Nieuw programma'}</b><button data-a="progopslaan" style="font-weight:700">Opslaan</button></div>
   <div class="pinhoud"><label>Naam van het programma</label><input class="veld" id="pNaam" value="${esc(p.naam)}" placeholder="Bijv. P3 Croissant"><div class="fout" id="fout"></div>
   <div class="minmax" style="margin-top:12px">${veld('pTemp','Temperatuur °C',p.temp,'bijv. 190',true)}${veld('pTijd','Baktijd (min)',p.baktijd,'bijv. 18',true)}</div>

let pluSort='naam',pluZoek='',pluZonder='';
function pluHtml(){
  return`<div class="kop"><div class="koprij"><h1>PLU-lijst</h1>${info('plu')}</div><p>Zoek op naam of nummer.</p></div>
   <div class="zoekbalk"><input class="veld" id="pluZoek" type="search" placeholder="Zoek, bijv. kaas of 43" value="${esc(pluZoek)}" autocomplete="off"></div>

   <div class="zoekbalk"><select class="veld" id="pluZonder"><option value="">Alle allergenen</option>${ALLERGENEN.map(([k,l])=>`<option value="${k}" ${pluZonder===k?'selected':''}>Zonder ${l.toLowerCase()}</option>`).join('')}</select></div>
   <div id="pluLijst">${pluLijstHtml()}</div>`}
function pluLijstHtml(){
  const z=pluZoek.trim().toLowerCase(),alle=S.soorten.filter(s=>s.naam.trim()&&(!z||s.naam.toLowerCase().includes(z)||(s.plu||'').includes(z)||(s.pluHalf||'').includes(z))&&(!pluZonder||!(s.allergenen||[]).includes(pluZonder)));
  const rij=s=>`<div class="rij"><button class="regel" ${mag('soorten')?`data-a="open" data-v="${s.id}"`:''}>${S.fotos[s.id]?`<img class="duim klein" src="${S.fotos[s.id]}" alt="">`:''}<div class="groei"><div class="naam">${esc(s.naam)}</div>${s.plu?'':'<div class="sub let">PLU nog niet ingevuld</div>'}${(s.allergenen||[]).length?`<div class="sub">Bevat: ${s.allergenen.map(k=>ALLERGENEN.find(a=>a[0]===k)?.[1].toLowerCase()).join(', ')}</div>`:''}</div>${s.plu?`<div class="plugroot">${esc(s.plu)}${s.pluHalf?`<small>½ ${esc(s.pluHalf)}</small>`:''}</div>`:''}</button></div>`;
  const sorteer=l=>[...l.filter(s=>s.plu).sort((a,b)=>a.naam.localeCompare(b.naam,'nl')),...l.filter(s=>!s.plu).sort((a,b)=>a.naam.localeCompare(b.naam,'nl'))];
  if(!alle.length)return`<p class="leeg">Niets gevonden.</p>`;
  if(pluSort==='naam')return`<div class="sectie">${sorteer(alle).map(rij).join('')}</div>`;
  const groepen=[...karNrs().map(nr=>[karNaam(nr),alle.filter(s=>s.type!=='vers'&&s.kar===nr)]),['Vers brood',alle.filter(s=>s.type==='vers')]].filter(g=>g[1].length);
  return groepen.map(([t,l])=>`<div class="sectie"><div class="karkop"><b>${esc(t)}</b></div>${sorteer(l).map(rij).join('')}</div>`).join('');
}

let undoSnap=null,undoTimer=null;
function undoStart(label){undoSnap={d:datum,label,v:kloon(S.vinkjes[datum]),st:kloon(S.status[datum]),a:kloon(S.aanpas[datum]),b:kloon(S.bijbak[datum]),sn:kloon(S.snij[datum]),h:kloon(S.historie[datum])}}
function undoToon(){if(!undoSnap)return;const el=document.getElementById('undo');el.innerHTML=`<span>${esc(undoSnap.label)}</span><button data-a="undo">Ongedaan</button>`;el.classList.add('zichtbaar');clearTimeout(undoTimer);undoTimer=setTimeout(()=>{el.classList.remove('zichtbaar')},4000)}
function undoVerberg(){const el=document.getElementById('undo');if(el)el.classList.remove('zichtbaar')}

function undoDoe(){const u=undoSnap;if(!u)return;const zet=(k,v)=>{if(v===undefined)delete S[k][u.d];else S[k][u.d]=v};
  zet('vinkjes',u.v);zet('status',u.st);zet('aanpas',u.a);zet('bijbak',u.b);zet('snij',u.sn);if(u.h!==undefined)S.historie[u.d]=u.h;
  log(`Ongedaan gemaakt: ${u.label}`);undoSnap=null;document.getElementById('undo').classList.remove('zichtbaar');bewaar();render()}

function printGegevens(){
  const d=datum,delen=[];
  for(const mo of S.momenten){const sec=maakLijst(d,mo.id),vers=versRegels(d,mo.id);if(!sec.length&&!vers.length)continue;const blokken=[];
    for(const s of sec){const k=karTaak(d,s.nr),nm=k?S.gebruikers.find(g=>g.id===k)?.naam:'';blokken.push({titel:s.naam+(nm?' – '+nm:''),rijen:s.regels.map(r=>[r.ontdooi?'–':r.plaat,r.s.naam,r.s.plu||'',`${r.n}${!r.ontdooi&&r.v.platen>1?` (${r.v.delen.join('+')})`:''}`,''])})}
    if(vers.length)blokken.push({titel:'Vers brood',rijen:vers.map(r=>['–',r.s.naam,r.s.plu||'',String(r.n),''])});
    delen.push({moment:mo.naam,blokken})}
  return{titel:'Brood Opzet – Coop Vogelenzang',datum:`${datumTekst(d)} ${vanIso(d).getFullYear()}${S.afwijkend[d]?' – '+S.afwijkend[d].naam:''}`,delen};
}
function maakPdf(){
  const g=printGegevens(),doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),O=[241,125,4];let y=16;
  doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(g.titel,14,y);doc.setFont('helvetica','normal');doc.setFontSize(11);doc.text(g.datum,196,y,{align:'right'});
  doc.setDrawColor(...O);doc.setLineWidth(1);doc.line(14,y+3,196,y+3);y+=10;
  if(!g.delen.length){doc.text('Niets gepland.',14,y)}
  for(const deel of g.delen){if(g.delen.length>1){doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(deel.moment,14,y);y+=4}
    for(const bl of deel.blokken){
      doc.autoTable({startY:y,head:[[{content:bl.titel,colSpan:5,styles:{fillColor:O,textColor:255,fontStyle:'bold',fontSize:11}}],['Plaat','Product','PLU','Aantal','OK']],body:bl.rijen,theme:'grid',
        styles:{fontSize:10,cellPadding:2,lineColor:[150,150,150],lineWidth:.2,textColor:20},headStyles:{fillColor:[240,240,240],textColor:20},
        columnStyles:{0:{cellWidth:18},2:{cellWidth:22},3:{cellWidth:32},4:{cellWidth:12}},margin:{left:14,right:14},rowPageBreak:'avoid'});
      y=doc.lastAutoTable.finalY+6}}
  return new File([doc.output('blob')],`brood-opzet-${datum}.pdf`,{type:'application/pdf'});
}

/* ---------- feestdagen ---------- */
function pasen(j){const a=j%19,b=Math.floor(j/100),c=j%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),n=h+l-7*m+114;return iso(new Date(j,Math.floor(n/31)-1,n%31+1))}
function feestdagen(j){const p=pasen(j),kd=new Date(j,3,27).getDay()===0?`${j}-04-26`:`${j}-04-27`;
  return[[`${j}-01-01`,'Nieuwjaarsdag'],[plusDagen(p,-2),'Goede Vrijdag'],[p,'1e Paasdag'],[plusDagen(p,1),'2e Paasdag'],[kd,'Koningsdag'],[`${j}-05-05`,'Bevrijdingsdag'],[plusDagen(p,39),'Hemelvaartsdag'],[plusDagen(p,49),'1e Pinksterdag'],[plusDagen(p,50),'2e Pinksterdag'],[`${j}-12-24`,'Kerstavond'],[`${j}-12-25`,'1e Kerstdag'],[`${j}-12-26`,'2e Kerstdag'],[`${j}-12-31`,'Oudejaarsdag']]}
function volgendeFeest(){const t=iso(),j=vanIso(t).getFullYear(),grens=plusDagen(t,21);
  return[...feestdagen(j),...feestdagen(j+1)].find(([d])=>d>t&&d<=grens&&!S.afwijkend[d]&&!S.feestNee[d])||null}

   .then(r=>r.json()).then(j=>{const d=j.daily;if(!d)return;const per={};d.time.forEach((t,i)=>per[t]={c:d.weather_code[i],max:Math.round(d.temperature_2m_max[i]),regen:d.precipitation_probability_max[i]??0});L.weer={t:Date.now(),per};bewaarL();renderZacht()}).catch(()=>{})}

function weerHint(w){if(!w)return'';if(w.max>=22&&w.regen<30)return`Mooi weer (${w.max}°C): vaak meer stokbrood en snacks`;if(w.regen>=70)return`Veel kans op regen (${w.regen}%): vaak rustiger in de winkel`;if(w.max<=3)return`Koud (${w.max}°C): vaak meer warme snacks`;return''}

function periodeDagen(){const t=iso();let van,tot=t;
  if(exportPeriode==='week')van=maandag(t);else if(exportPeriode==='vorige'){van=plusDagen(maandag(t),-7);tot=plusDagen(van,6)}else if(exportPeriode==='4w')van=plusDagen(t,-27);else van=t.slice(0,8)+'01';
  const r=[];for(let d=van;d<=tot;d=plusDagen(d,1))r.push(d);return r}
function laadXlsx(){return window.XLSX?Promise.resolve():new Promise((ok,nee)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=nee;document.head.appendChild(s)})}
function maakExport(){
  const dagen=periodeDagen();let rij,naam,blad;
  if(exportSoort==='planning'){rij=[['Soort','Kar',...DAGEN.map(d=>d[2])]];for(const s of S.soorten)rij.push([s.naam,karNaam(effKar(s)),...DAGEN.map(([k])=>dagTotaal(k,s))]);naam='planning';blad='Planning'}
  else if(exportSoort==='derving'){rij=[['Datum','Dag','Soort','PLU','Opgezet','Over','Weggegooid','Voedselbank','Too Good To Go','Verkocht','Derving %']];
    for(const d of dagen)for(const s of S.soorten){const g=S.historie[d]?.gezet?.[s.id]||0,x=dervDetail(d,s.id);if(!g&&!x)continue;const o=x?x.weg+x.vb+x.tg:null;
      rij.push([d,dagNaam(dagKey(d)),s.naam,s.plu||'',g,o??'',x?.weg??'',x?.vb??'',x?.tg??'',o==null?'':Math.max(0,g-o),o==null||!g?'':Math.round(o/g*1000)/10])}
    naam='derving';blad='Derving'}
  else{rij=[['Soort','PLU','Opgezet','Bijgebakken','Over (geteld)','Derving %','Dagen geteld']];
    for(const s of S.soorten){let g=0,gg=0,o=0,tel=0,bij=0;for(const d of dagen){const x=S.historie[d]?.gezet?.[s.id]||0;g+=x;bij+=bijbakStuks(d,s.id);const w=S.derving[d]?.[s.id];if(w!=null){o+=w;gg+=x;tel++}}

  const bestand=`brood-opzet-${naam}-${exportSoort==='planning'?iso():dagen[0]+'_tm_'+dagen[dagen.length-1]}.xlsx`;

/* ---------- Derving ---------- */
const BESTEMMING=[['weg','Weggegooid'],['vb','Voedselbank'],['tg','TGTG']];
function dervDetail(d,id){const t=S.derving[d]?.[id];const x=S.dervBest[d]?.[id];if(x)return{...x};return t!=null?{weg:t,vb:0,tg:0}:null}
function zetDerving(d,id,b,n){borgHistorie(d);S.dervBest[d]=S.dervBest[d]||{};S.derving[d]=S.derving[d]||{};
  const x=dervDetail(d,id)||{weg:0,vb:0,tg:0};x[b]=Math.max(0,n);S.dervBest[d][id]=x;S.derving[d][id]=x.weg+x.vb+x.tg}
function wisDerving(d,id,b){const x=dervDetail(d,id);if(!x)return;x[b]=0;if(!x.weg&&!x.vb&&!x.tg){if(S.dervBest[d])delete S.dervBest[d][id];if(S.derving[d])delete S.derving[d][id]}else{S.dervBest[d]=S.dervBest[d]||{};S.dervBest[d][id]=x;S.derving[d][id]=x.weg+x.vb+x.tg}}

let dervReden=new Date().getHours()>=14?'over':'gevallen';
const REDEN={gevallen:'Gevallen / beschadigd',over:'Over (eind van de dag)'};
function conceptVan(d){L.dervConcept=L.dervConcept||{};for(const x of Object.keys(L.dervConcept))if(x<plusDagen(iso(),-7))delete L.dervConcept[x];return L.dervConcept[d]=L.dervConcept[d]||{}}
function conceptTot(x){return x?(x.weg||0)+(x.vb||0)+(x.tg||0):0}
function regLijst(d){return Object.values(S.dervReg[d]||{}).sort((a,b)=>a.t-b.t)}
function regTotaal(d,id,reden){return regLijst(d).filter(r=>r.reden===reden).reduce((t,r)=>t+conceptTot(r.items[id]),0)}
function zorgReg(d){if(S.dervReg[d])return;S.dervReg[d]={};const ids=Object.keys(S.derving[d]||{});
  if(ids.length){const items={};for(const id of ids){const x=dervDetail(d,id);if(x)items[id]={weg:x.weg,vb:x.vb,tg:x.tg}}S.dervReg[d].eerder={id:'eerder',t:0,wie:'eerder ingevuld',reden:'over',items,kassa:null,kassaVink:{}}}}
function herbereken(d){borgHistorie(d);S.derving[d]={};S.dervBest[d]={};
  for(const r of regLijst(d)){for(const[id,x]of Object.entries(r.items)){const b=S.dervBest[d][id]=S.dervBest[d][id]||{weg:0,vb:0,tg:0};b.weg+=x.weg||0;b.vb+=x.vb||0;b.tg+=x.tg||0;S.derving[d][id]=b.weg+b.vb+b.tg}}}
function dervingHtml(){
  const d=dervDatum,hist=S.historie[d],con=conceptVan(d);
  let h=`<div class="kop"><div class="koprij"><h1>Derving</h1>${info('derving')}</div><p>Vul in en tik op <b>Lijst opslaan</b>. De lijst neem je over in de kassa.</p></div>
    <div class="datumrij"><button data-a="dd" data-v="-1">‹</button><input type="date" id="dervdatum" value="${d}" max="${iso()}"><button data-a="dd" data-v="1">›</button></div>

function gebruikerOpslaan(){
  const naam=document.getElementById('gNaam').value.trim(),pin=document.getElementById('gPin').value.trim(),fout=t=>document.getElementById('fout').textContent=t;
  if(!kanBeheren())return fout('Dit kan alleen op een toestel met de beheerders-login.');
  if(!naam)return fout('Vul een naam in.');
  if(S.gebruikers.some(x=>x.id!==bewerk.id&&x.naam.toLowerCase()===naam.toLowerCase()))return fout('Deze naam bestaat al.');
  if((bewerk.nieuw||pin)&&!/^[0-9]{4}$/.test(pin))return fout('Pincode moet 4 cijfers zijn.');
  const oud=S.gebruikers.find(x=>x.id===bewerk.id)||{},u={...oud,id:bewerk.id,naam,rol:bewerk.rol,pin:pin?hashPin(pin,bewerk.id):bewerk.pin};
  delete u.nieuw;delete u.soort;
  if(isAdmin()&&bewerk.rol!=='admin'){u.rechten={};for(const[k]of RECHTEN)u.rechten[k]=document.getElementById('r-'+k).checked;u.actief=document.getElementById('gActief').checked}
  const i=S.gebruikers.findIndex(x=>x.id===u.id);if(i>=0)S.gebruikers[i]=u;else S.gebruikers.push(u);
  log(bewerk.nieuw?`Medewerker ${naam} toegevoegd`:`Account ${naam} gewijzigd${pin?' (nieuwe pincode)':''}`);
  bewaar();sluit();render();
}

  else if(ds.derv){if(!mag('derving'))return;const n=getal(t.value);if(n==null)wisDerving(dervDatum,ds.derv,best);else zetDerving(dervDatum,ds.derv,best,n);bewaar()}
  else if(t.id==='notZoek'){notZoek=t.value;const el=document.getElementById('notLijst');if(el)el.innerHTML=notLijstHtml()}
  else if(t.id==='kzZoek'){zoekTerm=t.value;zoekFilter()}
  else if(t.id==='pluZoek'){pluZoek=t.value;const el=document.getElementById('pluLijst');if(el)el.innerHTML=pluLijstHtml()}
  else if(t.id==='afwNaam')afwForm.naam=t.value;
  else if(t.id==='afwDatum'&&t.value)afwForm.datum=t.value;
  else if(t.id==='ovenMaxIn'){if(!mag('soorten'))return;const n=getal(t.value);if(n>0){S.ovenMax=n;bewaar()}}
});
document.addEventListener('change',e=>{
  const t=e.target,ds=t.dataset||{},naam=id=>S.soorten.find(x=>x.id===id)?.naam;
  if(t.id==='dervdatum'&&t.value){dervDatum=t.value>iso()?iso():t.value;render()}
  else if(t.id==='planSelect'){planKeuze=t.value;render()}
  else if(t.id==='afwDatum'&&t.value)afwForm.datum=t.value;
  else if(t.id==='verberg0'){L.verberg0=t.checked;bewaarL();render()}
  else if(ds.prof){zetProf(ds.prof,t.checked)}
  else if(ds.plan&&ds.oud!==t.value){log(`Invullen ${planNaam(planKeuze)}${S.momenten.length>1?' '+momentNaam(moment):''}: ${naam(ds.plan)} ${ds.oud||'–'} → ${t.value||'leeg'}`);bewaar();ds.oud=t.value}
  else if(ds.cderv&&ds.oud!==t.value){render()}
  else if(ds.derv&&ds.oud!==t.value){log(`Derving ${datumTekst(dervDatum)}: ${naam(ds.derv)} ${BESTEMMING.find(y=>y[0]===best)[1].toLowerCase()} = ${t.value||'leeg'}`,'d:'+dervDatum+ds.derv+best);bewaar();ds.oud=t.value;
    const el=document.getElementById('ds-'+ds.derv);if(el)el.innerHTML=dervSub(dervDatum,ds.derv,S.historie[dervDatum]?.gezet?.[ds.derv]??0)}
  else if(t.id==='fFoto'&&t.files&&t.files[0])verkleinFoto(t.files[0]);
  else if(t.id==='levFotoIn'&&t.files&&t.files[0])verkleinNaar(t.files[0],1600,src=>{if(bewerk)bewerk.foto=src;const k=document.getElementById('levFotoKnop');if(k){k.classList.add('aan');k.firstChild.textContent='✓'}toast('Foto van de pakbon klaar')});
  else if(t.id==='notFotoIn'&&t.files&&t.files[0])verkleinNaar(t.files[0],1600,src=>{notFoto=src;const l=t.closest('.fotoknop');if(l){l.classList.add('aan');l.firstChild.textContent='✓'}toast('Foto klaar – typ eventueel tekst en tik op +')});
  else if(t.id==='notMetFoto'){notMetFoto=t.checked;const el=document.getElementById('notLijst');if(el)el.innerHTML=notLijstHtml()}
  else if(t.id==='pluZonder'){pluZonder=t.value;const el=document.getElementById('pluLijst');if(el)el.innerHTML=pluLijstHtml()}
  else if(t.id==='ovenMaxIn'){log(`Oven max. ${S.ovenMax} platen`,'ovenmax');t.value=S.ovenMax}
  else if(ds.moment){log(`Bakmoment hernoemd: ${t.value}`);bewaar()}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='notitieIn'){document.querySelector('[data-a=notitie]')?.click();return}
  const b=document.querySelector('[data-a=login],[data-a=setup],[data-a=koppel]');if(b)b.click()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){bewaarNu();return}weerLaden();if(volgVandaag)datum=iso();controleerSessie();if(L.gekoppeld&&db)sync();render()});
setInterval(()=>{const was=!!L.sessie;controleerSessie();if(was&&!L.sessie){werk=null;document.getElementById('werk').classList.remove('open');sluit();render()}},60000);

/* ================= start ================= */
if(window.ReactNativeWebView||window.__BEGINSTAAT__!==undefined)document.querySelector('.test')?.remove();
for(const d of Object.keys(S.derving))borgHistorie(d);
controleerSessie();
weerLaden();
db=maakDb();
if(L.modus==='lokaal')syncStatus='lokaal';
else if(L.gekoppeld)syncStatus=db?'start':'offline';
render();
(async()=>{
  if(L.modus==='lokaal'||!db)return;
  try{const ses=await db.sessie();
    if(!ses){if(L.gekoppeld){L.gekoppeld=false;bewaarL()}render();return}
    if(!L.gekoppeld)return;
    try{L.beheerder=await db.isBeheerder(ses.user.id);bewaarL()}catch(e){}
    await koppelStart();
  }catch(e){zetStatus('offline');render()}
})();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
