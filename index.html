<title>Broodkarren</title>
<style>

:root[data-theme="dark"]{--oranjeLicht:#3a2610;--tekst:#f2f2f2;--grijs:#9a9a9a;--lijn:#333;--kaart:#1c1c1e;--achter:#000;--rood:#ef5350;--groen:#66bb6a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}

button,input{font-family:inherit}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
main{flex:1;overflow-y:auto;padding-bottom:28px}

.segment{display:flex;margin:0 16px 8px;border-radius:10px;background:var(--oranjeLicht);padding:3px}
.segment button{flex:1;border:0;background:none;padding:9px 0;border-radius:8px;font-weight:600;font-size:15px;color:var(--oranje)}
.segment button.aan{background:var(--oranje);color:var(--op)}
.sectie{margin:14px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;overflow:hidden}

.karkop input{flex:1;background:none;border:0;color:var(--op);font-weight:800;font-size:17px;padding:0;min-width:0}

.rij{border-top:1px solid var(--lijn)}
.regel{display:flex;align-items:center;padding:12px 14px;width:100%;background:none;border:0;text-align:left;color:inherit}
.plaat{min-width:52px;height:44px;border:2px solid var(--oranje);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-right:14px;padding:0 4px;font-size:17px;font-weight:800;color:var(--oranje);flex:none}
.klaar .plaat{background:var(--grijs);border-color:var(--grijs);color:#fff}
.naam{font-size:17px;font-weight:600}.sub{font-size:14px;color:var(--grijs);margin-top:2px}

.let{color:var(--rood);font-weight:600}
.vinkvak{width:30px;height:30px;border-radius:50%;border:2px solid var(--lijn);margin-left:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.klaar .vinkvak{background:var(--oranje);border-color:var(--oranje)}
.groei{flex:1;min-width:0}
.groep{font-size:13px;color:var(--oranje);font-weight:700;margin-left:6px}
.pijl{font-size:26px;color:var(--grijs);margin-left:8px}
.hist{display:block;width:100%;border:0;background:var(--oranjeLicht);color:var(--tekst);text-align:left;padding:8px 14px 8px 80px;font-size:13px;line-height:1.35}
.hist b{color:var(--oranje)}
.histtab{padding:4px 14px 10px 80px;background:var(--oranjeLicht);font-size:13px}
.histtab table{border-collapse:collapse;width:100%}.histtab td,.histtab th{padding:3px 4px;text-align:right}.histtab th{color:var(--grijs);font-weight:600}.histtab td:first-child,.histtab th:first-child{text-align:left}
.toevoegen{display:block;width:100%;border:0;border-top:1px solid var(--lijn);background:none;padding:14px;color:var(--oranje);font-weight:700;font-size:16px}
.knoppen{display:flex;justify-content:center;gap:12px;margin-top:22px;padding:0 16px;flex-wrap:wrap}
.knop{background:var(--oranje);color:var(--op);border:2px solid var(--oranje);border-radius:10px;padding:11px 20px;font-weight:700;font-size:16px}
.knop.rand{background:var(--kaart);color:var(--oranje)}
.leeg{margin:24px;color:var(--grijs);font-size:16px;line-height:1.4}
.link{background:none;border:0;color:#fff;text-decoration:underline;font-size:14px}
.inv{display:flex;align-items:center;gap:10px;padding:10px 14px}

.karchip{border:1.5px solid var(--oranje);color:var(--oranje);background:none;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px}

.advies{border:0;background:var(--oranjeLicht);color:var(--oranje);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px;flex:none}

.datumrij{display:flex;align-items:center;gap:8px;margin:0 16px 6px}

.samenvat{margin:6px 16px 0;font-size:15px;color:var(--grijs)}
nav{display:flex;background:var(--kaart);border-top:1px solid var(--lijn)}
nav button{flex:1;border:0;background:none;padding:0 0 12px;font-weight:600;font-size:14px;color:var(--grijs)}
nav button:before{content:"";display:block;height:3px;width:60%;margin:0 auto 10px;border-radius:2px}
nav button.aan{color:var(--oranje)}nav button.aan:before{background:var(--oranje)}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
.paneel{background:var(--kaart);width:100%;max-width:640px;max-height:92%;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.pkop{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--lijn)}
.pkop b{font-size:17px}.pkop button{border:0;background:none;color:var(--oranje);font-size:17px}
.pinhoud{overflow-y:auto;padding:4px 20px 40px}
label{display:block;font-size:14px;font-weight:700;color:var(--grijs);margin:20px 0 8px}
input.veld{width:100%;border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;font-size:17px;background:var(--achter);color:var(--tekst)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--oranje);border-radius:20px;padding:8px 14px;background:none;color:var(--oranje);font-weight:700;font-size:14px}
.chip.aan{background:var(--oranje);color:var(--op)}
.hulp{font-size:13px;color:var(--grijs);margin-top:8px;line-height:1.4}
.minmax{display:flex;gap:16px}.minmax div{flex:1}
.fout{color:var(--rood);font-size:14px;margin-top:8px;min-height:1em}
.schakel{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--lijn);font-size:16px}
.schakel input{width:48px;height:28px;accent-color:var(--oranje)}
.login{padding:24px 20px}.login h1{font-size:30px;font-weight:800;margin:0 0 4px}.login p{color:var(--grijs);margin:0 0 20px;line-height:1.4}
.naamknop{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px solid var(--lijn);background:var(--kaart);color:var(--tekst);border-radius:12px;padding:16px;margin-bottom:10px;font-size:17px;font-weight:600;text-align:left}
.naamknop.aan{border:2px solid var(--oranje)}
.rol{font-size:13px;color:var(--oranje);font-weight:700}
.pinveld{letter-spacing:10px;text-align:center;font-size:24px!important}
.verwijder{display:block;margin:32px auto 0;border:0;background:none;color:var(--rood);font-weight:600;font-size:16px}
#timers:empty{display:none}
#timers{padding:6px 12px 0;display:flex;flex-direction:column;gap:6px}
.timer{display:flex;align-items:center;gap:10px;background:var(--kaart);border:2px solid var(--oranje);border-radius:12px;padding:8px 12px}
.timer .tijd{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--oranje);min-width:70px}
.timer .info{flex:1;font-size:13px;line-height:1.3;min-width:0}
.timer button{border:0;background:var(--oranje);color:var(--op);border-radius:8px;padding:8px 10px;font-weight:700;font-size:14px}
.timer.klaar{background:var(--rood);border-color:var(--rood);color:#fff;animation:knipper 1s infinite}
.timer.klaar .tijd{color:#fff}.timer.klaar button{background:#fff;color:var(--rood)}

.datumnav{display:flex;align-items:center;gap:8px;margin:0 16px 8px}
.datumnav button.pijlk{width:44px;height:44px;border-radius:10px;border:2px solid var(--oranje);background:var(--kaart);color:var(--oranje);font-size:20px;font-weight:700;flex:none}
.datumnav .dlabel{flex:1;text-align:center;border:0;background:none;color:var(--tekst);font-size:17px;font-weight:700}
.dlabel small{display:block;font-size:13px;color:var(--oranje);font-weight:600}
.pil{display:inline-block;background:var(--oranje);color:var(--op);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;margin:0 16px 8px}
.notities{margin:6px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px 12px}
.notitie{font-size:15px;padding:6px 0;border-bottom:1px solid var(--lijn);display:flex;gap:8px;align-items:flex-start}
.notitie:last-of-type{border-bottom:0}.notitie .wie{font-size:12px;color:var(--grijs)}
.notitie button{border:0;background:none;color:var(--grijs);font-size:18px;margin-left:auto;padding:0 4px}
.notitieform{display:flex;gap:8px;margin-top:6px}
.notitieform input{flex:1;border:1px solid var(--lijn);border-radius:10px;padding:10px;font-size:16px;background:var(--achter);color:var(--tekst);min-width:0}
.notitieform button{border:0;background:var(--oranje);color:var(--op);border-radius:10px;padding:0 14px;font-weight:700;font-size:15px}
.acties{display:flex;gap:10px;margin:12px 16px 0}
.acties .knop{flex:1;padding:12px 8px;font-size:15px}
.regel.gekozen{background:var(--oranjeLicht)}
.kiesvak{width:30px;height:30px;border-radius:8px;border:2px solid var(--oranje);margin-left:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
.gekozen .kiesvak{background:var(--oranje)}
.ovenbalk{position:sticky;bottom:0;margin:16px 0 0;background:var(--kaart);border-top:2px solid var(--oranje);padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.ovenbalk .rijtje{display:flex;gap:10px;align-items:center}
.ovenbalk input{width:64px;border:1px solid var(--lijn);border-radius:10px;padding:9px 0;font-size:17px;text-align:center;background:var(--achter);color:var(--tekst)}
select.veld{width:100%;border:1px solid var(--lijn);border-radius:10px;padding:12px 14px;font-size:17px;background:var(--kaart);color:var(--tekst);-webkit-appearance:none;appearance:none}
.planbalk{margin:0 16px 8px}
.menu .regel{padding:16px}
.terug{border:0;background:none;color:var(--oranje);font-size:17px;padding:10px 16px 0;font-weight:600}
.tabel{width:100%;border-collapse:collapse;font-size:14px}

.tabel td{text-align:right;padding:9px 6px;border-bottom:1px solid var(--lijn)}
.tabel th:first-child,.tabel td:first-child{text-align:left}
.tabelwrap{overflow-x:auto}
.hoog{color:var(--rood);font-weight:700}.goed{color:var(--groen);font-weight:700}
.kaartje{margin:14px 16px 0;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:12px 14px}

.cijfers{display:flex;gap:10px;margin:10px 16px 0}
.cijfer{flex:1;background:var(--kaart);border:1px solid var(--lijn);border-radius:12px;padding:10px;text-align:center}

.logregel{padding:10px 14px;border-top:1px solid var(--lijn);font-size:14px}

.daglabel{padding:8px 14px;background:var(--oranjeLicht);font-size:13px;font-weight:700;color:var(--oranje)}

.witem{background:var(--kaart);border:1px solid var(--lijn);border-radius:14px;padding:14px 16px;margin-bottom:10px}

.klaarscherm b{font-size:60px;color:var(--oranje)}
.statusrij{margin-top:4px;font-size:12px;color:var(--grijs);display:flex;flex-wrap:wrap;gap:4px}
.st{border-radius:8px;padding:1px 7px;font-weight:700;font-size:12px}
.st.oven{background:var(--rood);color:#fff}.st.gebak{background:var(--oranje);color:#fff}.st.schap{background:var(--groen);color:#fff}

.ovenstep{display:flex;align-items:center;gap:10px;padding:8px 14px 10px 80px;background:var(--oranjeLicht);font-size:14px}
.ovenstep input{width:48px}
.avondkaart{display:flex;justify-content:space-between;align-items:center;width:calc(100% - 32px);margin:10px 16px 0;border:2px solid var(--oranje);background:var(--oranjeLicht);color:var(--tekst);border-radius:12px;padding:12px 14px;font-size:15px;text-align:left}

textarea.veld{font-family:inherit;resize:vertical;line-height:1.4}
.fotorij{display:flex;gap:14px;align-items:center}
#fotoVoorbeeld{width:110px;height:110px;border-radius:12px;border:1px solid var(--lijn);background:var(--achter);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--grijs);font-size:13px;flex:none}
#fotoVoorbeeld img{width:100%;height:100%;object-fit:cover}
.duim{width:44px;height:44px;border-radius:8px;object-fit:cover;margin-right:12px;flex:none}
.wfoto{width:100%;max-height:200px;object-fit:cover;border-radius:10px;margin-bottom:10px}
.wprog{margin-top:8px;font-size:17px;color:var(--tekst)}.wprog b{color:var(--oranje)}
.winstr{margin-top:8px;font-size:16px;line-height:1.45;background:var(--oranjeLicht);border-radius:10px;padding:10px 12px}

#opslagmelding{display:none;background:var(--rood);color:#fff;font-size:14px;padding:8px 14px;text-align:center}
</style></head>

": {"p": null, "s": null}}, {"id": "b28", "kar": 2, "groep": "D", "naam": "Wit luxe stokbrood", "mv": {"p": 1, "s": 2}, "za": {"p": null, "s": null}, "zo": {"p": null, "s": null}}], "karren": [{"nr": 1, "naam": "KAR 1 – DEEG"}, {"nr": 2, "naam": "KAR 2 – KLEINBROOD"}]};
const DAGEN=[{key:'mv',label:'Ma t/m vr',titel:'maandag t/m vrijdag'},{key:'za',label:'Zaterdag',titel:'zaterdag'},{key:'zo',label:'Zondag',titel:'zondag'}];
const TABS=[['lijst','Klaarzetten',null],['plan','Invullen','invullen'],['derving','Derving','derving'],['meer','Meer',null]];

const vanIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};

const dagType=d=>{const w=(typeof d==='string'?vanIso(d):d).getDay();return w===6?'za':w===0?'zo':'mv'};
const datumTekst=s=>vanIso(s).toLocaleDateString('nl-NL',{weekday:'short',day:'numeric',month:'short'});
const tijdTekst=t=>new Date(t).toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'});

const getal=t=>{const m=String(t??'').match(/\d+/);if(!m)return null;return Math.min(9999,parseInt(m[0],10))};

/* ================= gegevens laden en omzetten ================= */
function vanV1(d){
  const S={soorten:[],karren:d.karren||[],plan:{mv:{},za:{},zo:{}},karOverride:{},historie:{},derving:{}};
  for(const it of d.items||[]){
    const mv=it.mv||{},st=[mv.s,it.za?.s,it.zo?.s].filter(x=>x>0),max=st.length?Math.max(...st):12;
    S.soorten.push({id:it.id,naam:it.naam,kar:it.kar,groep:it.groep||'',min:1,max});
    const m=(mv.p||0)*(mv.s||0);S.plan.mv[it.id]=m;
    for(const k of['za','zo']){const x=it[k]||{};if(x.p==null&&x.s==null)continue;const v=(x.p??mv.p??0)*(x.s??mv.s??0);if(v!==m)S.plan[k][it.id]=v}
  }
  return S;
}
function naarV3(S){
  if(S.versie>=3)return S;
  const plan={mv:{m1:{}},za:{m1:{}},zo:{m1:{}}};
  for(const k of['mv','za','zo'])for(const[id,v]of Object.entries((S.plan||{})[k]||{}))if(v!=null)plan[k].m1[id]=v;
  S.plan=plan;S.momenten=[{id:'m1',naam:'Ochtend'}];
  for(const s of S.soorten){s.temp??=null;s.baktijd??=null;s.perDoos??=null}
  S.vinkjes={};S.versie=3;return S;
}
let S=null;
try{S=window.__BEGINSTAAT__||JSON.parse(localStorage.getItem(OPSLAG)||'null')}catch(e){}
if(!S||!S.soorten){let v1=null;try{v1=JSON.parse(localStorage.getItem('broodkarren-v1')||'null')}catch(e){}S=vanV1(v1&&v1.items?v1:DEFAULTS)}
S=naarV3(S);
for(const k of['historie','derving','karOverride','afwijkend','notities','voorraad','vinkjes','status','avond','dervBest'])S[k]=S[k]||{};
S.ovenMax=S.ovenMax||10;
for(const s of S.soorten){s.programma??='';s.instructie??='';s.foto??=null;if(s.ontdooien===undefined)s.ontdooien=true}
for(const k of['gebruikers','timers','log'])S[k]=S[k]||[];
S.leverdagen=S.leverdagen||[1,3,5];
if(!S.momenten||!S.momenten.length)S.momenten=[{id:'m1',naam:'Ochtend'}];
function borgHistorie(d){if(S.historie[d])return;const pk=S.afwijkend[d]?'afw:'+d:dagType(d),gezet={};
  for(const s of S.soorten){const n=S.momenten.reduce((t,m)=>t+stuksIn(pk,m.id,s),0);if(n>0)gezet[s.id]=n}S.historie[d]={dag:dagType(d),afw:!!S.afwijkend[d],gezet}}

/* ================= accounts & rechten ================= */
function hashPin(pin,zout){let h=2166136261;for(const c of zout+':'+pin){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
const ik=()=>S.gebruikers.find(g=>g.id===S.sessie);
const UITLOG_MIN=60;let fouteLogins=0,geblokkeerdTot=0;
function controleerSessie(){if(S.sessie&&S.laatsteActie&&Date.now()-S.laatsteActie>UITLOG_MIN*60000){S.sessie=null;loginKeuze=null}}
const isAdmin=()=>ik()?.rol==='admin';
function mag(r){const g=ik();if(!g)return false;if(g.rol==='admin')return true;return g.actief!==false&&!!(g.rechten||{})[r]}
function log(tekst,sleutel){
  const t=Date.now(),wie=ik()?.naam||'?',l=S.log[S.log.length-1];
  if(sleutel&&l&&l.k===sleutel&&l.wie===wie&&t-l.t<90000){l.tekst=tekst;l.t=t}else S.log.push({t,wie,tekst,k:sleutel||null});
  if(S.log.length>1500)S.log=S.log.slice(-1200);
}

/* ================= planning ================= */
const effKar=s=>S.karOverride[s.id]??s.kar;
const planKeyVoor=d=>S.afwijkend[d]?'afw:'+d:dagType(d);
const momentNaam=id=>S.momenten.find(m=>m.id===id)?.naam||'';
function planNaam(pk){if(pk.startsWith('afw:')){const d=pk.slice(4);return`${datumTekst(d)} – ${S.afwijkend[d]?.naam||'afwijkend'}`}return DAGEN.find(x=>x.key===pk).label}
function stuksIn(pk,m,s){
  if(pk.startsWith('afw:'))return S.afwijkend[pk.slice(4)]?.plan?.[m]?.[s.id]??0;
  const mv=S.plan.mv[m]?.[s.id]??0;if(pk==='mv')return mv;
  const v=S.plan[pk][m]?.[s.id];return v==null?mv:v;
}
function eigenWaarde(pk,m,id){
  if(pk.startsWith('afw:'))return S.afwijkend[pk.slice(4)]?.plan?.[m]?.[id];
  return S.plan[pk][m]?.[id];
}
function zetStuks(pk,m,id,n){
  let doel;
  if(pk.startsWith('afw:')){const a=S.afwijkend[pk.slice(4)];a.plan[m]=a.plan[m]||{};doel=a.plan[m]}
  else{S.plan[pk][m]=S.plan[pk][m]||{};doel=S.plan[pk][m]}
  if(n==null)delete doel[id];
  else if(pk==='za'||pk==='zo'){if(n===(S.plan.mv[m]?.[id]??0))delete doel[id];else doel[id]=n}
  else doel[id]=n;
}
const dagTotaal=(pk,s)=>S.momenten.reduce((t,m)=>t+stuksIn(pk,m.id,s),0);
function verdeling(n,max){max=max>0?max:n;const p=Math.ceil(n/max),rest=n-(p-1)*max;return{platen:p,delen:p?[...Array(p-1).fill(max),rest]:[],rest}}
function karNrs(){return[...new Set([...S.karren.map(k=>k.nr),...S.soorten.map(effKar)])].filter(Number.isInteger).sort((a,b)=>a-b)}
function karNaam(nr){const k=S.karren.find(x=>x.nr===nr);return(k&&k.naam&&k.naam.trim())||`Kar ${nr}`}
function maakLijst(pk,m){
  const out=[];
  for(const nr of karNrs()){
    const regels=S.soorten.filter(s=>effKar(s)===nr&&s.naam.trim()).map(s=>({s,n:stuksIn(pk,m,s)})).filter(r=>r.n>0);
    if(!regels.length)continue;
    const gk=s=>s.groep&&s.groep.trim()?'g:'+s.groep.trim().toUpperCase():'e:'+s.id;
    const gp={};for(const r of regels){r.v=verdeling(r.n,r.s.max);r.g=gk(r.s);gp[r.g]=Math.max(gp[r.g]||0,r.v.platen)}
    const start={};let volg=1;
    for(const r of regels){if(start[r.g]===undefined){start[r.g]=volg;volg+=gp[r.g]}
      const a=start[r.g],b=a+gp[r.g]-1;r.plaat=b>a?`${a}–${b}`:`${a}`;r.aantalPlaten=gp[r.g];r.teWeinig=r.s.min>0&&r.v.rest<r.s.min}
    out.push({nr,naam:karNaam(nr),regels,totaal:regels.reduce((t,r)=>t+r.n,0),platen:volg-1});
  }
  return out;
}

/* ================= historie, advies, opslag ================= */
function snapshot(){
  const d=iso(),pk=planKeyVoor(d),gezet={};
  for(const s of S.soorten){const n=dagTotaal(pk,s);if(n>0)gezet[s.id]=n}
  S.historie[d]={dag:dagType(d),afw:pk.startsWith('afw:'),gezet};
  const grens=plusDagen(d,-180);
  for(const k of['historie','derving','notities'])for(const x of Object.keys(S[k]))if(x<grens)delete S[k][x];
  for(const k of['vinkjes','status','avond'])for(const x of Object.keys(S[k]))if(x<plusDagen(d,-7))delete S[k][x];
  for(const x of Object.keys(S.dervBest))if(x<grens)delete S.dervBest[x];
}
let bewaarTimer=null,opslagFout=false;
function bewaarNu(){clearTimeout(bewaarTimer);bewaarTimer=null;snapshot();const t=JSON.stringify(S);let ok=true;
  try{localStorage.setItem(OPSLAG,t)}catch(e){ok=!!window.ReactNativeWebView}
  if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(t);
  if(ok!==!opslagFout){opslagFout=!ok;const el=document.getElementById('opslagmelding');if(el)el.style.display=opslagFout?'block':'none'}}
function bewaar(){S.laatsteActie=Date.now();if(!bewaarTimer)bewaarTimer=setTimeout(bewaarNu,400)}
window.addEventListener('pagehide',bewaarNu);
function historie(s,dag){
  return Object.keys(S.derving).filter(d=>dagType(d)===dag&&!S.afwijkend[d]&&!S.historie[d]?.afw&&S.derving[d][s.id]!=null).sort().reverse().slice(0,8)
    .map(d=>{const gezet=S.historie[d]?.gezet?.[s.id]??0,der=S.derving[d][s.id];return{d,gezet,der,verkocht:Math.max(0,gezet-der)}});
}
function advies(s,dag){
  const h=historie(s,dag).slice(0,4);if(h.length<2)return null;
  const gemDer=h.reduce((t,x)=>t+x.der,0)/h.length,gemGezet=h.reduce((t,x)=>t+x.gezet,0)/h.length;
  if(h.every(x=>x.der===0))return{h,gemDer,gemGezet,op:true};
  return{h,gemDer,gemGezet,aantal:Math.max(s.min||0,Math.ceil(h.reduce((t,x)=>t+x.verkocht,0)/h.length))};
}
function adviesTekst(a,huidig){
  if(!a)return'';if(a.op)return`<b>${a.h.length}× niets over</b> – misschien meer klaarzetten?`;
  const pct=a.gemGezet?Math.round(a.gemDer/a.gemGezet*100):0;
  return`Gem. ${Math.round(a.gemDer*10)/10} over (${pct}%) laatste ${a.h.length}×`+(a.aantal!==huidig?` – <b>advies ${a.aantal} per dag</b>`:'');
}
function verdeelAdvies(pk,s,A){
  const ms=S.momenten.map(m=>m.id),cur=ms.map(m=>stuksIn(pk,m,s)),T=cur.reduce((a,b)=>a+b,0);
  let nieuw;
  if(T===0){nieuw=ms.map(m=>m===moment?A:0)}
  else{nieuw=cur.map(c=>Math.floor(A*c/T));let rest=A-nieuw.reduce((a,b)=>a+b,0);const i=cur.indexOf(Math.max(...cur));nieuw[i]+=rest}
  ms.forEach((m,i)=>zetStuks(pk,m,s.id,nieuw[i]));
}

/* ================= deegbestelling ================= */
function volgendeLeverdag(vanaf){for(let i=1;i<=14;i++){const d=plusDagen(vanaf,i);if(S.leverdagen.includes(vanIso(d).getDay()))return d}return null}
function bestelBerekening(){
  const t=iso(),L1=volgendeLeverdag(t);if(!L1)return null;const L2=volgendeLeverdag(L1)||plusDagen(L1,7);
  const dagen=[];for(let d=plusDagen(t,1);d<L2;d=plusDagen(d,1))dagen.push(d);
  const regels=S.soorten.map(s=>{const nodig=dagen.reduce((x,d)=>x+dagTotaal(planKeyVoor(d),s),0),voorraad=S.voorraad[s.id]??0;
    const tekort=s.perDoos?Math.max(0,nodig-voorraad*s.perDoos):null;return{s,nodig,voorraad,dozen:s.perDoos?Math.ceil(tekort/s.perDoos):null}}).filter(r=>r.nodig>0||r.voorraad>0);
  return{L1,L2,van:dagen[0],tot:dagen[dagen.length-1],regels};
}

/* ================= toestand scherm ================= */
let tab='lijst',sub=null,datum=iso(),moment=S.momenten[0].id,planKeuze=planKeyVoor(iso()),open={},dervDatum=iso(),
    bewerk=null,verwStap=false,loginKeuze=null,ovenModus=false,ovenKeuze={},werk=null,rapWeek=null,afwStap=null,melding='';
function maandag(d){const x=vanIso(d),w=(x.getDay()+6)%7;return plusDagen(d,-w)}
rapWeek=maandag(iso());

function render(){
  const m=document.getElementById('scherm'),nav=document.getElementById('nav');
  if(!S.momenten.find(x=>x.id===moment))moment=S.momenten[0].id;
  if(!S.gebruikers.some(g=>g.rol==='admin')){m.innerHTML=setupHtml();nav.innerHTML='';renderTimers();return}

  const t=TABS.find(x=>x[0]===tab);if(!t||(t[2]&&!mag(t[2])))tab='lijst';
  m.innerHTML=tab==='lijst'?lijstHtml():tab==='plan'?planHtml():tab==='derving'?dervingHtml():meerHtml();
  nav.innerHTML=TABS.filter(x=>!x[2]||mag(x[2])).map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'aan':''}">${l}</button>`).join('');
  renderTimers();if(werk)renderWerk();

const momentSegment=()=>S.momenten.length<2?'':`<div class="segment">${S.momenten.map(x=>`<button data-a="moment" data-v="${x.id}" class="${x.id===moment?'aan':''}">${esc(x.naam)}</button>`).join('')}</div>`;

/* ---------- Klaarzetten ---------- */
function gKey(nr,r){return r.s.kar+'|'+r.g}
function vindGroep(gk){for(const x of maakLijst(planKeyVoor(datum),moment))for(const r of x.regels)if(gKey(x.nr,r)===gk)return{r,nr:x.nr};return null}
function stat(d,m,k,maak){if(!maak)return S.status[d]?.[m]?.[k]||{oven:0,gebakken:0,schap:0};S.status[d]=S.status[d]||{};S.status[d][m]=S.status[d][m]||{};return S.status[d][m][k]=S.status[d][m][k]||{oven:0,gebakken:0,schap:0}}
function restPlaten(r,nr){const s=stat(datum,moment,gKey(nr,r));return Math.max(0,r.aantalPlaten-s.oven-s.gebakken-s.schap)}
function statusRegel(r,nr,kl){
  const s=stat(datum,moment,gKey(nr,r));if(!kl&&!s.oven&&!s.gebakken&&!s.schap)return'';
  const d=[kl?'✓ klaargezet':'',s.oven?`<span class="st oven">${s.oven} in oven</span>`:'',s.gebakken?`<span class="st gebak">${s.gebakken} gebakken</span>`:'',s.schap?`<span class="st schap">${s.schap} in schap</span>`:''].filter(Boolean);
  return`<div class="statusrij">${d.join(' ')}</div>`;
}
function lijstHtml(){
  const pk=planKeyVoor(datum),sec=maakLijst(pk,moment),v=S.vinkjes[datum]?.[moment]||{},dt=dagType(datum),vandaag=datum===iso();
  const n=sec.reduce((t,x)=>t+x.regels.length,0),k=sec.reduce((t,x)=>t+x.regels.filter(r=>v[r.s.id]).length,0);
  let h=`<div class="kop"><h1>Klaarzetten</h1><p>${n?`${k} van ${n} klaar`:'Niets klaar te zetten'}</p></div>

function ovenGekozen(sec){
  const uit=[];for(const s of sec){const gezien={};for(const r of s.regels){const gk=gKey(s.nr,r);if(ovenKeuze[gk]==null)continue;
    if(!gezien[gk]){gezien[gk]={gk,n:ovenKeuze[gk],plaat:r.plaat,regels:[]};uit.push(gezien[gk])}gezien[gk].regels.push(r)}}
  return uit;
}
function ovenBalk(sec){
  const gek=ovenGekozen(sec),regels=gek.flatMap(g=>g.regels),totaal=gek.reduce((t,g)=>t+g.n,0);
  const tijden=regels.map(r=>r.s.baktijd).filter(x=>x>0),temps=[...new Set(regels.map(r=>r.s.temp).filter(x=>x>0))],progs=[...new Set(regels.map(r=>(r.s.programma||'').trim()).filter(Boolean))];
  const teVeel=totaal>S.ovenMax,waarsch=[];
  if(teVeel)waarsch.push(`maximaal ${S.ovenMax} platen in de oven`);if(progs.length>1)waarsch.push('verschillende programma\'s');else if(temps.length>1)waarsch.push('verschillende temperaturen');
  return`<div class="ovenbalk"><div class="rijtje"><div style="flex:1">${gek.length?`<b>${totaal} van max. ${S.ovenMax} platen</b>${progs.length?` – prog. ${progs.map(esc).join(' / ')}`:''}${temps.length?` – ${temps.join('/')}°C`:''}`:'Tik aan wat de oven in gaat.'}${waarsch.length?`<div class="let">Let op: ${waarsch.join(', ')}!</div>`:''}</div><button class="knop rand" style="padding:8px 10px;font-size:14px" data-a="ladingen">Voorstel</button></div>
    <div class="rijtje"><span>Baktijd</span><input id="ovenMin" inputmode="numeric" maxlength="3" value="${tijden.length?Math.max(...tijden):15}"><span>min</span><button class="knop" style="margin-left:auto" data-a="ovenstart" ${gek.length&&!teVeel?'':'disabled'}>Start timer</button></div></div>`;
}
function ladingVoorstel(){
  const sec=maakLijst(planKeyVoor(datum),moment),groepen=[];
  for(const s of sec){const gezien={};for(const r of s.regels){const gk=gKey(s.nr,r);if(gezien[gk]){gezien[gk].namen.push(r.s.naam);continue}
    const rest=restPlaten(r,s.nr);if(!rest)continue;const sleutel=(r.s.programma||'').trim()||(r.s.temp?r.s.temp+'°C':'zonder programma');
    gezien[gk]={gk,rest,sleutel,namen:[r.s.naam],tijd:r.s.baktijd||0};groepen.push(gezien[gk])}}
  const per={};for(const g of groepen)(per[g.sleutel]=per[g.sleutel]||[]).push(g);
  const ladingen=[];
  for(const[sl,gs]of Object.entries(per)){let cur=null;
    for(const g of gs){let rest=g.rest;while(rest>0){if(!cur||cur.totaal>=S.ovenMax){cur={sleutel:sl,items:[],totaal:0,tijd:0};ladingen.push(cur)}
      const n=Math.min(rest,S.ovenMax-cur.totaal);cur.items.push({gk:g.gk,n,namen:g.namen});cur.totaal+=n;cur.tijd=Math.max(cur.tijd,g.tijd);rest-=n}}}
  return ladingen;
}
function openLadingen(){

   <div class="knoppen" style="justify-content:flex-start;padding:0;margin-top:10px"><button class="knop" data-a="ladingkies" data-v="${i}">Deze lading kiezen</button></div></div>`).join(''):'<p class="leeg">Alles is al gebakken of in de oven.</p>'}</div>`);

/* ---------- Werkmodus ---------- */
function werkPlaten(){
  const pk=planKeyVoor(datum),uit=[];
  for(const s of maakLijst(pk,moment)){const map=new Map();
    for(const r of s.regels){if(!map.has(r.plaat)){map.set(r.plaat,{kar:s.naam,plaat:r.plaat,aantal:r.aantalPlaten,regels:[]});uit.push(map.get(r.plaat))}map.get(r.plaat).regels.push(r)}}
  return uit;
}
function renderWerk(){
  const el=document.getElementById('werk'),p=werkPlaten(),v=S.vinkjes[datum]?.[moment]||{};
  if(!p.length){werk=null;el.classList.remove('open');return}
  werk.i=Math.min(Math.max(0,werk.i),p.length);el.classList.add('open');

    <div class="wknoppen"><div class="wklein"><button data-a="werknav" data-v="-1">‹ Terug</button><button data-a="werkdicht">Sluiten</button></div></div>`}
  else{const x=p[werk.i],ok=x.regels.every(r=>v[r.s.id]);
    h+=`<div class="winhoud"><div class="wkar">${esc(x.kar)}</div><div class="wplaat"><small>Plaat</small>${x.plaat}</div>
      ${x.regels.map(r=>`<div class="witem ${v[r.s.id]?'ok':''}">${r.s.foto?`<img class="wfoto" src="${r.s.foto}" alt="">`:''}<div class="n">${esc(r.s.naam)}</div><div class="a">${r.n} stuks${r.v.platen>1||r.v.delen[0]!==r.n?` (${r.v.delen.join(' + ')})`:''}</div>
        ${r.s.programma||r.s.temp||r.s.baktijd?`<div class="wprog">${r.s.programma?`Ovenprogramma <b>${esc(r.s.programma)}</b>`:''}${[r.s.temp?r.s.temp+'°C':'',r.s.baktijd?r.s.baktijd+' min':''].filter(Boolean).map(t=>` · ${t}`).join('')}</div>`:''}
        ${r.s.instructie?`<div class="winstr">${esc(r.s.instructie).replace(/\n/g,'<br>')}</div>`:''}</div>`).join('')}</div>
      <div class="wknoppen"><button class="wgroot" data-a="werkklaar">${ok?'Volgende plaat ›':'✓ Klaar – volgende'}</button><div class="wklein"><button data-a="werknav" data-v="-1">‹ Vorige</button><button data-a="werknav" data-v="1">Overslaan ›</button></div></div>`}

/* ---------- Oven-timers ---------- */
let audio=null;
function ontgrendelAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
function piep(){try{if(!audio)return;for(let i=0;i<3;i++){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;o.connect(g);g.connect(audio.destination);
  const t=audio.currentTime+i*.35;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3)}}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
let laatstePiep=0;
let timerSig='';
function renderTimers(){
  const el=document.getElementById('timers'),nu=Date.now(),kan=mag('vinken');let klaar=false;
  const sig=S.timers.map(t=>t.id+(t.eind<=nu?'k':'')).join(',')+'|'+kan;
  if(sig!==timerSig){timerSig=sig;
    el.innerHTML=S.timers.map(t=>`<div class="timer ${t.eind<=nu?'klaar':''}"><div class="tijd" id="tt-${t.id}"></div><div class="info"><b>Oven${t.programma?` – prog. ${esc(t.programma)}`:''}</b><br>${esc(t.soorten)}${t.temp?`, ${esc(t.temp)}°C`:''}</div>${kan?`<button data-a="uitoven" data-v="${t.id}">Uit oven</button>`:''}</div>`).join('')}
  for(const t of S.timers){const rest=Math.round((t.eind-nu)/1000);if(rest<=0)klaar=true;
    const e=document.getElementById('tt-'+t.id);if(e)e.textContent=rest<=0?'KLAAR':`${Math.floor(rest/60)}:${pad(rest%60)}`}
  if(klaar&&nu-laatstePiep>6000){laatstePiep=nu;piep()}
}
setInterval(renderTimers,1000);
setInterval(()=>{const was=!!S.sessie;controleerSessie();if(was&&!S.sessie){werk=null;document.getElementById('werk').classList.remove('open');sluit();render()}},60000);

/* ---------- Invullen ---------- */
function planOpties(){
  const afw=Object.keys(S.afwijkend).filter(d=>d>=plusDagen(iso(),-1)).sort();
  if(planKeuze.startsWith('afw:')&&!S.afwijkend[planKeuze.slice(4)])planKeuze=dagType(iso());
  return DAGEN.map(d=>`<option value="${d.key}" ${planKeuze===d.key?'selected':''}>${d.label}</option>`).join('')+
    (afw.length?`<optgroup label="Afwijkende dagen">${afw.map(d=>`<option value="afw:${d}" ${planKeuze==='afw:'+d?'selected':''}>${esc(datumTekst(d))} – ${esc(S.afwijkend[d].naam)}</option>`).join('')}</optgroup>`:'');
}
function planRegelHint(s){
  const n=stuksIn(planKeuze,moment,s);if(!n)return'Niet klaarzetten';
  const v=verdeling(n,s.max);let t=`${v.platen} ${v.platen===1?'plaat':'platen'} (${v.delen.join(' + ')})`;
  if(S.momenten.length>1){const tot=dagTotaal(planKeuze,s);if(tot!==n)t+=` – dag totaal ${tot}`}

function adviesLijst(){

/* ---------- Derving ---------- */
const BESTEMMING=[['weg','Weggegooid'],['vb','Voedselbank'],['tg','TGTG']];
let best='weg';
function dervDetail(d,id){const t=S.derving[d]?.[id];const x=S.dervBest[d]?.[id];if(x)return x;return t!=null?{weg:t,vb:0,tg:0}:null}
function zetDerving(d,id,b,n){borgHistorie(d);S.dervBest[d]=S.dervBest[d]||{};S.derving[d]=S.derving[d]||{};
  const x=dervDetail(d,id)||{weg:0,vb:0,tg:0};x[b]=Math.max(0,n);S.dervBest[d][id]=x;S.derving[d][id]=x.weg+x.vb+x.tg}
function wisDerving(d,id,b){const x=dervDetail(d,id);if(!x)return;x[b]=0;if(!x.weg&&!x.vb&&!x.tg){if(S.dervBest[d])delete S.dervBest[d][id];if(S.derving[d])delete S.derving[d][id]}else{S.dervBest[d]=S.dervBest[d]||{};S.dervBest[d][id]=x;S.derving[d][id]=x.weg+x.vb+x.tg}}
function dervSub(d,id,g){const x=dervDetail(d,id),v=x?BESTEMMING.filter(([k])=>x[k]).map(([k])=>`${x[k]} ${k==='weg'?'weg':k==='vb'?'VB':'TGTG'}`).join(', '):'';
  return`${g} klaargezet${x?` – over: ${v||'0'}`:''}`}
function dervingHtml(){
  const d=dervDatum,pk=planKeyVoor(d),rec=S.derving[d]||{},hist=S.historie[d];
  let h=`<div class="kop"><h1>Derving</h1><p>Wat is er over, en waar gaat het heen? Kies eerst de bestemming.</p></div>

    <div class="segment">${BESTEMMING.map(([k,l])=>`<button data-a="best" data-v="${k}" class="${best===k?'aan':''}">${l}</button>`).join('')}</div>`;
  let tg=0,td=0,tb={weg:0,vb:0,tg:0},rijen='';
  for(const nr of karNrs()){
    const lijst=S.soorten.filter(s=>effKar(s)===nr).map(s=>({s,g:hist?.gezet?.[s.id]??(hist?0:dagTotaal(pk,s))})).filter(x=>x.g>0||rec[x.s.id]!=null);

    rijen+=`<div class="sectie"><div class="karkop"><b>${esc(karNaam(nr))}</b></div>`;
    for(const{s,g}of lijst){const x=dervDetail(d,s.id);if(x){tg+=g;td+=x.weg+x.vb+x.tg;for(const k in tb)tb[k]+=x[k]}
      rijen+=`<div class="rij inv"><div class="groei"><div class="naam">${esc(s.naam)}</div><div class="sub" id="ds-${s.id}">${dervSub(d,s.id,g)}</div></div>

function rapportHtml(){

    for(const d of dagen){const g=S.historie[d]?.gezet?.[s.id]??0;gezet+=g;const w=S.derving[d]?.[s.id];const bx=dervDetail(d,s.id);if(bx)for(const k in tb)tb[k]+=bx[k];

  if(notes.length)h+=`<div class="kaartje"><h3>Dagnotities</h3>${notes.map(n=>`<div class="sub"><b>${esc(datumTekst(n.d))}</b>: ${esc(n.tekst)} (${esc(n.wie)})</div>`).join('')}</div>`;
  return h+`<div class="knoppen"><button class="knop rand" data-a="deelrapport">Delen</button></div>`;

function soortOpslaan(){
  const w=id=>getal(document.getElementById(id).value),naam=document.getElementById('fNaam').value.trim(),min=w('fMin'),max=w('fMax');
  const fout=t=>document.getElementById('fout').textContent=t;
  if(!naam)return fout('Vul de naam in.');if(!max)return fout('Vul het maximum per plaat in.');if(min!=null&&min>max)return fout('Minimum is groter dan maximum.');
  const nw={id:bewerk.id,naam,kar:bewerk.kar,groep:document.getElementById('fGroep').value.trim().toUpperCase(),min:min||0,max,temp:w('fTemp'),baktijd:w('fTijd'),perDoos:w('fDoos'),
    programma:document.getElementById('fProg').value.trim(),instructie:document.getElementById('fInstr').value.trim(),foto:bewerk.foto||null,ontdooien:document.getElementById('fOntdooi').checked};
  const i=S.soorten.findIndex(x=>x.id===nw.id);
  if(i>=0)S.soorten[i]=nw;else{const l=S.soorten.map(x=>x.kar).lastIndexOf(nw.kar);S.soorten.splice(l+1,0,nw)}
  log(`Broodsoort ${naam} ${i>=0?'gewijzigd':'toegevoegd'}`);bewaar();sluit();render();
}
function verkleinFoto(file){
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=480,sc=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    if(bewerk){bewerk.foto=c.toDataURL('image/jpeg',.7);document.getElementById('fotoVoorbeeld').innerHTML=`<img src="${bewerk.foto}" alt="">`}};img.src=r.result};r.readAsDataURL(file);
}

  else if(ds.derv&&ds.oud!==t.value){log(`Derving ${datumTekst(dervDatum)}: ${naam(ds.derv)} ${BESTEMMING.find(y=>y[0]===best)[1].toLowerCase()} = ${t.value||'leeg'}`,'d:'+dervDatum+ds.derv+best);bewaar();ds.oud=t.value;const el=document.getElementById('ds-'+ds.derv);if(el)el.innerHTML=dervSub(dervDatum,ds.derv,S.historie[dervDatum]?.gezet?.[ds.derv]??0)}
  else if(t.id==='fFoto'&&t.files&&t.files[0])verkleinFoto(t.files[0]);
  else if(t.id==='ovenMaxIn'){log(`Oven max. ${S.ovenMax} platen`,'ovenmax');t.value=S.ovenMax}
  else if(ds.voorraad&&ds.oud!==t.value){log(`Voorraad ${naam(ds.voorraad)}: ${t.value||0} dozen`,'v:'+ds.voorraad);bewaar();ds.oud=t.value}
  else if(ds.moment){log(`Bakmoment hernoemd: ${t.value}`);bewaar()}
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='notitieIn'){document.querySelector('[data-a=notitie]')?.click();return}
  const b=document.querySelector('[data-a=login],[data-a=setup]');if(b)b.click()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){bewaarNu();return}if(datum<iso())datum=iso();controleerSessie();bewaar();render()});
for(const d of Object.keys(S.derving))borgHistorie(d);
controleerSessie();
if(window.ReactNativeWebView||window.__BEGINSTAAT__!==undefined)document.querySelector('.test')?.remove();
bewaarNu();render();

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
